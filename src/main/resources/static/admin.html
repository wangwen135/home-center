<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Home Center 后台概览">
    <meta name="author" content="wwh">
    <title>后台概览 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260623-admin-home">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260623-admin-home">
    <script src="/js/app-theme.js?v=20260623-admin-home"></script>
    <style>
        /* 概览页私有样式。外壳样式来自 admin-shell.css。 */
        .ov-section-title {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--hc-text);
        }

        .ov-stat-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 6px;
        }

        .ov-stat-card {
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface-strong);
            box-shadow: var(--hc-shadow-soft);
            padding: 16px 18px;
        }

        .ov-stat-card strong {
            display: block;
            font-size: 26px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--hc-text);
        }

        .ov-stat-card span {
            color: var(--hc-muted);
            font-size: 13px;
        }

        .ov-audit-list {
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
            border: 1px solid var(--hc-line);
            border-radius: 10px;
            background: var(--hc-surface-strong);
            overflow: hidden;
        }

        .ov-audit-list li {
            display: grid;
            grid-template-columns: minmax(0,2fr) minmax(0,2fr) minmax(0,1fr) minmax(0,2fr);
            gap: 10px;
            padding: 9px 14px;
            font-size: 13px;
            border-bottom: 1px solid var(--hc-line);
        }

        .ov-audit-list li:last-child { border-bottom: 0; }
        .ov-audit-list .ov-audit-empty { display: block; padding: 18px; text-align: center; color: var(--hc-muted); }

        @media (max-width: 900px) {
            .ov-stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        .ov-panel {
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface);
            box-shadow: var(--hc-shadow-soft);
            padding: 20px;
            margin-bottom: 20px;
        }

        #systemLabContainer {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 10px 12px;
            min-height: 80px;
            padding: 6px 0;
        }

        .sys-desc-container {
            position: relative;
            max-width: 100%;
            margin: 0;
            padding: 22px 22px 14px 22px;
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface-strong);
            color: var(--hc-text);
            display: none;
        }

        .sys-desc-container code {
            display: block;
            margin-top: 8px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.06);
            color: var(--hc-text);
            white-space: pre-wrap;
        }

        .sys-desc-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--hc-line);
            background: #ffffff;
        }

        .sys-desc-close {
            position: absolute;
            top: 14px;
            right: 14px;
        }

        .sys-access-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .sys-access-card {
            display: grid;
            gap: 8px;
            padding: 14px;
            border: 1px solid var(--hc-line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.42);
        }

        :root[data-theme="dark"] .sys-access-card {
            background: rgba(15, 23, 42, 0.22);
        }

        .sys-access-card span {
            color: var(--hc-muted);
            overflow-wrap: anywhere;
        }

        /* 内部系统入口小方块（由 JS 渲染） */
        .sys-lab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 92px;
            padding: 10px 6px;
            border: 1px solid var(--hc-line);
            border-radius: 10px;
            background: var(--hc-surface-strong);
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .sys-lab:hover {
            border-color: rgba(37, 99, 235, 0.32);
            background: var(--hc-soft-accent);
        }

        .sys-lab img.sys-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: contain;
        }

        .sys-lab .sys-text {
            font-size: 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .ov-empty {
            width: 100%;
            padding: 24px 0;
            text-align: center;
            color: var(--hc-muted);
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .ov-panel { padding: 16px; }
            .sys-access-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">
            <span class="admin-brand-mark">HC</span>
            <span class="admin-brand-text">Home Center</span>
        </div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单">
            <span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span>
        </button>
    </aside>

    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span>
                        <span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <a class="admin-dropdown-item" href="/" role="menuitem">公开导航</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                    <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                    <span data-theme-toggle-text>深色</span>
                </button>
            </div>
        </header>

        <main class="admin-content" role="main">
            <section class="ov-panel">
                <h2 class="ov-section-title">系统概览</h2>
                <div class="ov-stat-grid">
                    <div class="ov-stat-card"><strong id="statSessions">—</strong><span>在线会话</span></div>
                    <div class="ov-stat-card"><strong id="statDevices">—</strong><span>设备（在线）</span></div>
                    <div class="ov-stat-card"><strong id="statUsers">—</strong><span>用户总数</span></div>
                    <div class="ov-stat-card"><strong id="statAudit">—</strong><span>最近审计</span></div>
                </div>
                <ul id="auditList" class="ov-audit-list" aria-label="最近设备审计">
                    <li class="ov-audit-empty">审计加载中...</li>
                </ul>
            </section>

            <section class="ov-panel">
                <h2 class="ov-section-title">内部系统</h2>
                <div id="systemLabContainer">
                    <div class="ov-empty">系统入口加载中...</div>
                </div>
            </section>

            <section class="ov-panel">
                <div id="sysDescContainer" class="sys-desc-container">
                    <img id="sysIcon" src="/favicon.ico" alt="" class="sys-desc-icon">
                    <button type="button" class="hc-close-button sys-desc-close" aria-label="关闭" onclick="closeSysDesc()"></button>
                    <h3 id="sysName" style="margin:6px 0 4px;">系统名称</h3>
                    <p id="sysDesc" class="hc-muted" style="margin:0;">系统说明</p>
                    <p><code id="sysRemark">其它说明信息</code></p>

                    <div class="sys-access-grid">
                        <div class="sys-access-card">
                            <a id="sysInternalAddr-A" href="#" target="_blank" class="hc-button">内网地址访问</a>
                            <span id="sysInternalAddr">-</span>
                        </div>
                        <div class="sys-access-card">
                            <a id="sysInternetAddr-A" href="#" target="_blank" class="hc-button hc-button-primary">公网地址访问</a>
                            <span id="sysInternetAddr">-</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260623-admin-home"></script>
<script>
    window.HcAdminShell && window.HcAdminShell.init({title: '后台概览', breadcrumb: 'Home Center'});
</script>
<script>
    // 内部系统入口（原 index.js 的 system lab 逻辑，剥离菜单/用户部分，由外壳接管导航与用户区）
    function loadSystemLab() {
        getRequest('/user/internalSystem', function (data) {
            var container = document.getElementById('systemLabContainer');
            container.innerHTML = '';
            if (!data || !data.length) {
                container.innerHTML = '<div class="ov-empty">暂无可访问的内部系统</div>';
                return;
            }
            data.forEach(function (s) {
                var labDiv = document.createElement('div');
                labDiv.className = 'sys-lab';
                labDiv.tabIndex = 0;
                labDiv.dataset.status = s.sysStatus;

                var sysImg = document.createElement('img');
                sysImg.src = s.icon;
                sysImg.alt = s.sysName;
                sysImg.className = 'sys-icon';
                sysImg.onerror = function () { this.style.visibility = 'hidden'; };

                var sysSpan = document.createElement('span');
                sysSpan.textContent = s.sysName;
                sysSpan.className = 'sys-text';
                sysSpan.title = s.sysName;

                labDiv.appendChild(sysImg);
                labDiv.appendChild(sysSpan);
                container.appendChild(labDiv);

                labDiv.addEventListener('click', function () { sysLabClick(s); });
                labDiv.addEventListener('contextmenu', function (event) {
                    sysLabRightClick(s);
                    event.preventDefault();
                });
            });
        }, function () {
            var container = document.getElementById('systemLabContainer');
            if (container) {
                container.innerHTML = '<div class="ov-empty">内部系统加载失败，请确认登录状态或权限</div>';
            }
        });
    }

    function sysLabClick(sysInfo) {
        var hostname = window.location.hostname;
        var url = sysInfo.internetUrl;
        if (isPrivateIP(hostname)) {
            url = sysInfo.internalUrl;
        }
        if (url) {
            window.open(url, url);
        }
    }

    function isPrivateIP(ipAddress) {
        if (ipAddress === 'localhost' || ipAddress === '127.0.0.1') {
            return true;
        }
        var privateIPPatterns = [
            /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/,
            /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}$/,
            /^192\.168\.\d{1,3}\.\d{1,3}$/
        ];
        return privateIPPatterns.some(function (pattern) { return pattern.test(ipAddress); });
    }

    function sysLabRightClick(sysInfo) {
        var container = document.getElementById('sysDescContainer');
        document.getElementById('sysIcon').src = sysInfo.icon || '/favicon.ico';
        document.getElementById('sysName').textContent = sysInfo.sysName;
        document.getElementById('sysDesc').textContent = sysInfo.sysDescription;
        document.getElementById('sysRemark').textContent = sysInfo.remark;
        document.getElementById('sysInternalAddr-A').href = sysInfo.internalUrl || '#';
        document.getElementById('sysInternalAddr').textContent = sysInfo.internalUrl || '-';
        document.getElementById('sysInternetAddr-A').href = sysInfo.internetUrl || '#';
        document.getElementById('sysInternetAddr').textContent = sysInfo.internetUrl || '-';
        container.style.display = 'block';
    }

    function closeSysDesc() {
        var container = document.getElementById('sysDescContainer');
        if (container) {
            container.style.display = 'none';
        }
    }

    // 概览统计：用户/在线会话/设备/最近审计。各接口独立、容错（无权限或失败显示“—”/“暂无”）
    function setText(id, text) {
        var el = document.getElementById(id);
        if (el) {
            el.textContent = text;
        }
    }

    function loadOverviewStats() {
        // 在线会话数
        getRequest('/backend/token/list', function (list) {
            setText('statSessions', String((list || []).length));
        }, function () { setText('statSessions', '—'); });

        // 设备总数（在线）
        getRequest('/device/pc/devices', function (list) {
            var arr = list || [];
            var online = arr.filter(function (d) { return Boolean(d.online); }).length;
            setText('statDevices', arr.length + '（' + online + '）');
        }, function () { setText('statDevices', '—'); });

        // 用户总数（PageInfo.total）
        request('/backend/user/findPage', {method: 'POST', body: {pageNum: 1, pageSize: 1}}, function (data) {
            setText('statUsers', String((data && data.total != null) ? data.total : '—'));
        }, function () { setText('statUsers', '—'); });

        // 最近审计（设备操作日志，取最近若干条）
        getRequest('/backend/device/pc/audit', function (list) {
            var arr = (list || []).slice(0, 6);
            setText('statAudit', String((list || []).length));
            renderAuditList(arr);
        }, function () {
            setText('statAudit', '—');
            renderAuditList([]);
        });
    }

    function renderAuditList(rows) {
        var ul = document.getElementById('auditList');
        if (!ul) {
            return;
        }
        if (!rows.length) {
            ul.innerHTML = '<li class="ov-audit-empty">暂无审计记录</li>';
            return;
        }
        ul.innerHTML = rows.map(function (r) {
            return '<li><span>' + escapeHtml(r.operator || r.username || '—') + '</span>' +
                '<span>' + escapeHtml(r.operationType || r.operation || '') + '</span>' +
                '<span>' + escapeHtml(r.status == null ? '' : r.status) + '</span>' +
                '<span>' + escapeHtml(r.createTime || r.operationTime || '') + '</span></li>';
        }).join('');
    }

    function escapeHtml(value) {
        return window.HomeCenter.escapeHtml(value);
    }

    function initOverview() {
        loadOverviewStats();
        loadSystemLab();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initOverview);
    } else {
        initOverview();
    }
</script>
</body>
</html>
