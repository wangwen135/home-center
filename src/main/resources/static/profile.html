<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260614-theme-icon">
    <script src="/js/app-theme.js?v=20260614-theme-icon"></script>
    <style>
        .profile-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .profile-form .full {
            grid-column: 1 / -1;
        }

        .avatar-preview {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .avatar-preview img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid var(--hc-border, rgba(255, 255, 255, .15));
        }

        .profile-msg {
            display: inline-block;
            margin-left: 12px;
            font-size: 14px;
        }

        .profile-msg-ok {
            color: #1f9d55;
        }

        .profile-msg-err {
            color: #d64545;
        }

        @media (max-width: 720px) {
            .profile-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="hc-app">
<main class="hc-shell hc-stack">
    <header class="hc-topbar">
        <div class="hc-title-block">
            <p class="hc-eyebrow">Profile</p>
            <h1 class="hc-title">个人信息</h1>
            <p class="hc-subtitle">查看和维护当前登录账号的基础信息。</p>
        </div>
        <div class="hc-actions">
            <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                <span data-theme-toggle-text>深色</span>
            </button>
            <a class="hc-button" href="/admin.html">返回首页</a>
        </div>
    </header>

    <section class="hc-panel hc-panel-pad">
        <form class="profile-form">
            <label>
                <span class="hc-form-label">用户名</span>
                <input type="text" class="hc-input" id="username" placeholder="用户名" readonly>
            </label>
            <label>
                <span class="hc-form-label">角色</span>
                <input type="text" class="hc-input" id="role" placeholder="角色" readonly>
            </label>
            <label>
                <span class="hc-form-label">昵称</span>
                <input type="text" class="hc-input" id="nickname" placeholder="昵称">
            </label>
            <label>
                <span class="hc-form-label">性别</span>
                <select class="hc-select" id="gender">
                    <option>男</option>
                    <option>女</option>
                    <option>其他</option>
                </select>
            </label>
            <label class="full">
                <span class="hc-form-label">头像</span>
                <input type="file" class="hc-input" id="avatar" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" aria-describedby="avatarHelp">
                <span id="avatarHelp" class="hc-help-text">支持 PNG/JPEG/GIF/WebP/SVG，文件大小不超过 2MB，选择后立即上传。</span>
                <span id="avatarPreviewWrap" class="avatar-preview" style="display:none;">
                    <img id="avatarPreview" src="" alt="头像预览">
                </span>
            </label>
            <label>
                <span class="hc-form-label">手机号码</span>
                <input type="tel" class="hc-input" id="phone" placeholder="手机号码">
            </label>
            <label>
                <span class="hc-form-label">邮箱</span>
                <input type="email" class="hc-input" id="email" placeholder="邮箱">
            </label>
            <label>
                <span class="hc-form-label">过期时间</span>
                <input type="datetime-local" class="hc-input" id="expire-time" readonly>
            </label>
            <label>
                <span class="hc-form-label">创建时间</span>
                <input type="datetime-local" class="hc-input" id="create-time" readonly>
            </label>
            <label>
                <span class="hc-form-label">修改时间</span>
                <input type="datetime-local" class="hc-input" id="modify-time" readonly>
            </label>
            <div class="full hc-actions">
                <button type="submit" class="hc-button hc-button-primary">保存修改</button>
                <span id="profileMsg" class="hc-help-text profile-msg"></span>
            </div>
        </form>
    </section>

    <section class="hc-panel hc-panel-pad">
        <div class="hc-title-block" style="margin-bottom:16px;">
            <h2 class="hc-section-title">修改密码</h2>
            <p class="hc-muted">密码修改走现有接口，不保留无后端支撑的伪保存操作。</p>
        </div>
        <form id="passwordForm" class="profile-form" novalidate>
            <label>
                <span class="hc-form-label">旧密码</span>
                <input type="password" class="hc-input" id="oldPassword" autocomplete="current-password" required>
            </label>
            <label>
                <span class="hc-form-label">新密码</span>
                <input type="password" class="hc-input" id="newPassword" autocomplete="new-password" required>
            </label>
            <label>
                <span class="hc-form-label">确认新密码</span>
                <input type="password" class="hc-input" id="confirmPassword" autocomplete="new-password" required>
            </label>
            <div class="full hc-actions">
                <button id="passwordSubmit" type="submit" class="hc-button hc-button-primary">更新密码</button>
                <span id="passwordMsg" class="hc-help-text profile-msg"></span>
            </div>
        </form>
    </section>
</main>
<script src="/js/profile.js?v=20260620"></script>
<script>
    (function () {
        var form = document.getElementById('passwordForm');
        var submit = document.getElementById('passwordSubmit');
        var msg = document.getElementById('passwordMsg');

        function setMessage(text, ok) {
            if (!msg) {
                return;
            }
            msg.textContent = text || '';
            msg.className = 'hc-help-text profile-msg ' + (ok ? 'profile-msg-ok' : 'profile-msg-err');
        }

        if (!form) {
            return;
        }

        form.addEventListener('submit', function (event) {
            var oldPassword = document.getElementById('oldPassword').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            event.preventDefault();
            setMessage('', true);

            if (!oldPassword || !newPassword || !confirmPassword) {
                setMessage('请完整填写密码信息。', false);
                return;
            }
            if (newPassword !== confirmPassword) {
                setMessage('两次输入的新密码不一致。', false);
                return;
            }
            if (newPassword.length < 6) {
                setMessage('新密码长度至少为 6 位。', false);
                return;
            }

            submit.disabled = true;
            submit.textContent = '更新中...';
            window.HomeCenter.request('/user/changePassword?oldPassword=' + encodeURIComponent(oldPassword) +
                '&newPassword=' + encodeURIComponent(newPassword), {
                method: 'PUT'
            }).then(function (result) {
                if (result.code !== 200) {
                    throw new Error(result.message || '修改失败');
                }
                form.reset();
                setMessage('密码已更新。', true);
                window.HomeCenter.toast('密码已更新', 'success');
            }).catch(function (error) {
                setMessage(error.message || '修改密码失败。', false);
                window.HomeCenter.toast(error.message || '修改密码失败', 'error');
            }).finally(function () {
                submit.disabled = false;
                submit.textContent = '更新密码';
            });
        });
    })();
</script>
</body>
</html>
