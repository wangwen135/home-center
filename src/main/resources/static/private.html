<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Home Center 私有导航">
    <title>私有导航 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260621-private-nav">
    <style>
        body.hc-app {
            min-height: 100vh;
            background: var(--hc-bg);
            color: var(--hc-text);
        }

        .pn-shell {
            width: min(1180px, calc(100% - 28px));
            margin: 0 auto;
            padding: 20px 0 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pn-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 20px;
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface);
            box-shadow: var(--hc-shadow-soft);
        }

        .pn-topbar h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
        }

        .pn-topbar .pn-subtitle {
            margin: 6px 0 0;
            color: var(--hc-muted);
            font-size: 13px;
        }

        .pn-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pn-actions a,
        .pn-actions button {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            padding: 0 14px;
            border: 1px solid var(--hc-line);
            border-radius: 8px;
            background: var(--hc-surface-strong);
            color: var(--hc-text);
            text-decoration: none;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .pn-actions a:hover,
        .pn-actions button:hover {
            border-color: rgba(37, 99, 235, 0.32);
            background: var(--hc-soft-accent);
            color: var(--hc-accent);
        }

        .pn-search {
            width: 100%;
            box-sizing: border-box;
            height: 40px;
            padding: 0 14px;
            border: 1px solid var(--hc-line);
            border-radius: 8px;
            background: var(--hc-surface);
            color: var(--hc-text);
            font: inherit;
        }

        .pn-group {
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface);
            box-shadow: var(--hc-shadow-soft);
            padding: 18px 20px;
        }

        .pn-group-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
        }

        .pn-group-icon {
            color: var(--hc-muted);
        }

        .pn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .pn-tile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--hc-line);
            border-radius: 10px;
            background: var(--hc-surface-strong);
            color: var(--hc-text);
            text-decoration: none;
            font: inherit;
            cursor: pointer;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        /* 健康状态小圆点（轻量展示，不显示详细错误） */
        .pn-health-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .pn-health-dot.normal {
            background: var(--hc-success);
        }

        .pn-health-dot.abnormal {
            background: var(--hc-danger);
        }

        .pn-health-dot.timeout {
            background: var(--hc-warning);
        }

        .pn-health-dot.unknown {
            background: var(--hc-muted);
            opacity: 0.5;
        }

        .pn-tile:hover {
            border-color: rgba(37, 99, 235, 0.32);
            background: var(--hc-soft-accent);
        }

        /* 说明/命令类入口与普通链接区分：左侧色条 + 虚线边框 */
        .pn-tile.is-note {
            border-style: dashed;
            border-left: 4px solid var(--hc-warning);
        }

        .pn-icon {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--hc-line);
            background: #fff center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            overflow: hidden;
        }

        .pn-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .pn-tile-body {
            min-width: 0;
            flex: 1 1 auto;
        }

        .pn-tile-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pn-badge {
            flex: 0 0 auto;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.3;
            padding: 2px 6px;
            border-radius: 999px;
            background: var(--hc-soft-accent);
            color: var(--hc-accent);
        }

        .pn-badge.note {
            background: rgba(217, 119, 6, 0.14);
            color: var(--hc-warning);
        }

        .pn-badge.success {
            background: rgba(22, 163, 74, 0.14);
            color: var(--hc-success);
        }

        .pn-badge.muted {
            background: rgba(100, 116, 139, 0.14);
            color: var(--hc-muted);
        }

        .pn-tile-desc {
            margin-top: 2px;
            color: var(--hc-muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pn-empty {
            padding: 40px 0;
            text-align: center;
            color: var(--hc-muted);
        }

        /* 说明/命令弹窗 */
        .pn-instruction {
            margin: 0;
            padding: 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.06);
            color: var(--hc-text);
            white-space: pre-wrap;
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
        }

        .pn-dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media (max-width: 640px) {
            .pn-shell {
                width: min(100% - 18px, 1180px);
            }

            .pn-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="hc-app">
<div class="pn-shell">
    <header class="pn-topbar">
        <div>
            <h1>私有导航</h1>
            <p class="pn-subtitle">登录后的个人内网工具入口。说明/命令类入口点击查看详情或复制命令。</p>
        </div>
        <div class="pn-actions">
            <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                <span data-theme-toggle-text>深色</span>
            </button>
            <a href="/admin.html">返回首页</a>
            <a href="/logout">退出</a>
        </div>
    </header>

    <input id="pnSearch" class="pn-search" type="search" placeholder="搜索私有导航..." aria-label="搜索私有导航">

    <main id="pnContent" aria-live="polite">
        <div class="pn-empty">私有导航加载中...</div>
    </main>
</div>

<script src="/js/app-theme.js?v=20260621-private-nav"></script>
<script src="/js/main.js"></script>
<script src="/js/private-nav.js?v=20260621-private-nav"></script>
</body>
</html>
