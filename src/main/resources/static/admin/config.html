<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统配置 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260623-config">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260623-config">
    <script src="/js/app-theme.js?v=20260623-config"></script>
    <style>
        .cfg-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .cfg-note { color:var(--hc-muted); font-size:13px; }
        .cfg-panel { border:1px solid var(--hc-line); border-radius:12px; background:var(--hc-surface); box-shadow:var(--hc-shadow-soft); overflow:auto; }
        table.cfg-table { width:100%; border-collapse:collapse; font-size:13px; min-width:680px; }
        table.cfg-table th, table.cfg-table td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--hc-line); vertical-align:middle; }
        table.cfg-table th { font-weight:700; color:var(--hc-muted); background:var(--hc-surface-strong); white-space:nowrap; }
        .cfg-empty { padding:36px 0; text-align:center; color:var(--hc-muted); }
        .cfg-key { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:rgba(15,23,42,0.06); padding:2px 6px; border-radius:5px; }
        :root[data-theme="dark"] .cfg-key { background:rgba(255,255,255,0.08); }
        .cfg-value { outline:none; border-radius:5px; padding:2px 4px; min-height:20px; }
        .cfg-value:focus { background:var(--hc-soft-accent); box-shadow:inset 0 0 0 1px var(--hc-accent); }
        .cfg-value[contenteditable="true"] { cursor:text; }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand"><span class="admin-brand-mark">HC</span><span class="admin-brand-text">Home Center</span></div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单"><span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span></button>
    </aside>
    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span><span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题"><span class="hc-theme-toggle-icon" aria-hidden="true"></span><span data-theme-toggle-text>深色</span></button>
            </div>
        </header>
        <main class="admin-content" role="main">
            <div class="cfg-toolbar">
                <button id="refreshConfigBtn" class="btn btn-sm" type="button">刷新</button>
                <span class="cfg-note">仅展示非敏感配置；直接编辑值后回车或失焦自动保存。</span>
            </div>
            <div class="cfg-panel">
                <table class="cfg-table">
                    <thead><tr><th>配置项</th><th>值</th><th>说明</th></tr></thead>
                    <tbody id="configTableBody"><tr><td colspan="3" class="cfg-empty">加载中...</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260623-config"></script>
<script>window.HcAdminShell && window.HcAdminShell.init({title: '系统配置', breadcrumb: '系统'});</script>
<script>
(function () {
    function escapeHtml(v) { return window.HomeCenter.escapeHtml(v); }

    function loadConfigs() {
        getRequest('/backend/config/list', function (list) {
            renderConfigs(list || []);
        }, function () {
            document.getElementById('configTableBody').innerHTML = '<tr><td colspan="3" class="cfg-empty">加载失败或暂无可配置项</td></tr>';
        });
    }

    function renderConfigs(list) {
        var tbody = document.getElementById('configTableBody');
        if (!list || !list.length) {
            tbody.innerHTML = '<tr><td colspan="3" class="cfg-empty">暂无可配置项</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(function (item) {
            return '<tr>' +
                '<td><span class="cfg-key">' + escapeHtml(item.configKey) + '</span></td>' +
                '<td><span class="cfg-value" contenteditable="true" data-key="' + escapeHtml(item.configKey) + '">' + escapeHtml(item.configValue) + '</span></td>' +
                '<td>' + escapeHtml(item.description) + '</td>' +
                '</tr>';
        }).join('');
    }

    function saveConfigValue(cell) {
        var key = cell.getAttribute('data-key');
        var value = cell.textContent;
        request('/backend/config/update', {method: 'PUT', body: {key: key, value: value}}, function () {
            showToastSimple('配置已保存', MsgTypes.SUCCESS, Position.TopCenter);
        });
    }

    function bind() {
        document.getElementById('refreshConfigBtn').addEventListener('click', loadConfigs);
        var tbody = document.getElementById('configTableBody');
        tbody.addEventListener('blur', function (e) {
            var cell = e.target.closest('.cfg-value[contenteditable="true"]');
            if (cell) { saveConfigValue(cell); }
        }, true);
        tbody.addEventListener('keydown', function (e) {
            var cell = e.target.closest('.cfg-value[contenteditable="true"]');
            if (cell && e.key === 'Enter') { e.preventDefault(); cell.blur(); }
        });
    }

    function init() { bind(); loadConfigs(); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
</body>
</html>
