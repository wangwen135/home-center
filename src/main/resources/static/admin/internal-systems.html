<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>内部系统 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260626-isys">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260626-isys">
    <script src="/js/app-theme.js?v=20260626-isys"></script>
    <style>
        .isys-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .isys-panel { border:1px solid var(--hc-line); border-radius:12px; background:var(--hc-surface); box-shadow:var(--hc-shadow-soft); overflow:auto; }
        table.isys-table { width:100%; border-collapse:collapse; font-size:13px; min-width:1280px; }
        table.isys-table th, table.isys-table td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--hc-line); vertical-align:middle; }
        table.isys-table th { font-weight:700; color:var(--hc-muted); background:var(--hc-surface-strong); white-space:nowrap; }
        table.isys-table tr:hover td { background:var(--hc-soft-accent); }
        .isys-empty { padding:36px 0; text-align:center; color:var(--hc-muted); }
        .isys-clip { display:inline-block; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .isys-actions { display:flex; gap:8px; justify-content:flex-end; }
        .isys-actions .btn { min-height:30px; padding:0 10px; font-size:12px; }
        .isys-actions .btn-danger { color:var(--hc-danger); border-color:rgba(220,38,38,0.32); }
        .isys-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .isys-grid .full { grid-column:1 / -1; }
        .hc-muted { color:var(--hc-muted); }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand"><span class="admin-brand-mark">HC</span><span class="admin-brand-text">Home Center</span></div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单"><span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span></button>
    </aside>
    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span><span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题"><span class="hc-theme-toggle-icon" aria-hidden="true"></span><span data-theme-toggle-text>深色</span></button>
            </div>
        </header>
        <main class="admin-content" role="main">
            <div class="isys-toolbar"><button id="addInternalSystemBtn" class="btn btn-primary btn-sm" type="button">新增系统</button></div>
            <div class="isys-panel">
                <table class="isys-table">
                    <thead><tr><th>名称</th><th>域名</th><th>说明</th><th>状态</th><th>图标</th><th>公网地址</th><th>内网地址</th><th>排序</th><th>启用</th><th class="text-end">操作</th></tr></thead>
                    <tbody id="internalSystemTableBody"><tr><td colspan="10" class="isys-empty">加载中...</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="internalSystemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <form class="modal-content" id="internalSystemForm">
            <div class="modal-header"><h6 class="modal-title" id="internalSystemModalTitle">新增系统</h6><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <div class="modal-body">
                <input type="hidden" id="internalSystemId">
                <div class="isys-grid">
                    <div><label class="form-label" for="internalSystemSysName">系统名称</label><input class="form-control" id="internalSystemSysName" required></div>
                    <div><label class="form-label" for="internalSystemSysDomain">域名</label><input class="form-control" id="internalSystemSysDomain"></div>
                    <div class="full"><label class="form-label" for="internalSystemSysDescription">说明</label><input class="form-control" id="internalSystemSysDescription"></div>
                    <div><label class="form-label" for="internalSystemSysStatus">状态</label><input class="form-control" id="internalSystemSysStatus"></div>
                    <div><label class="form-label" for="internalSystemIcon">图标</label><input class="form-control" id="internalSystemIcon"></div>
                    <div><label class="form-label" for="internalSystemInternetUrl">公网地址</label><input class="form-control" id="internalSystemInternetUrl"></div>
                    <div><label class="form-label" for="internalSystemOpenInternetUrl">开放公网地址</label><input class="form-control" id="internalSystemOpenInternetUrl"></div>
                    <div><label class="form-label" for="internalSystemInternalUrl">内网地址</label><input class="form-control" id="internalSystemInternalUrl"></div>
                    <div><label class="form-label" for="internalSystemSort">排序</label><input class="form-control" id="internalSystemSort" type="number" value="0"></div>
                    <div class="full"><label class="form-label" for="internalSystemConfig">配置</label><textarea class="form-control" id="internalSystemConfig" rows="2"></textarea></div>
                    <div class="full"><label class="form-label" for="internalSystemRemark">备注</label><textarea class="form-control" id="internalSystemRemark" rows="2"></textarea></div>
                    <div><label class="form-label" for="internalSystemDisabled">启用状态</label><select class="form-select" id="internalSystemDisabled"><option value="0">启用</option><option value="1">禁用</option></select></div>
                </div>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-primary">保存</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button></div>
        </form>
    </div>
</div>

<div class="modal fade" id="assignUsersModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">分配用户 — <span id="assignSysName"></span></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <input class="form-control mb-2" id="assignUserSearch" placeholder="搜索用户名/昵称…" type="search">
                <div id="assignUserList" style="max-height:380px;overflow:auto;border:1px solid var(--hc-line);border-radius:8px;"></div>
            </div>
            <div class="modal-footer">
                <span class="hc-muted me-auto" id="assignUserCount">已选 0 人</span>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="assignSaveBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260626-isys"></script>
<script>window.HcAdminShell && window.HcAdminShell.init({title: '内部系统', breadcrumb: '应用接入'});</script>
<script>
(function () {
    var internalSystems = [];
    var internalSystemModal = new bootstrap.Modal(document.getElementById('internalSystemModal'));
    var assignModal = new bootstrap.Modal(document.getElementById('assignUsersModal'));
    var assignSysId = null;
    var assignAllUsers = [];
    var assignSelected = {};

    function $(s) { return document.querySelector(s); }
    function val(id) { return document.getElementById(id).value; }
    function setVal(id, v) { document.getElementById(id).value = v; }
    function escapeHtml(v) { return window.HomeCenter.escapeHtml(v); }
    function clip(v) { return '<span class="isys-clip" title="' + escapeHtml(v) + '">' + escapeHtml(v) + '</span>'; }

    function loadInternalSystems() {
        getRequest('/backend/data/internal-systems', function (list) { internalSystems = list || []; renderInternalSystems(); }, function () { internalSystems = []; renderInternalSystems(); });
    }

    function renderInternalSystems() {
        var tbody = document.getElementById('internalSystemTableBody');
        if (!internalSystems.length) { tbody.innerHTML = '<tr><td colspan="10" class="isys-empty">暂无数据</td></tr>'; return; }
        tbody.innerHTML = internalSystems.map(function (item) {
            return '<tr>' +
                '<td>' + escapeHtml(item.sysName) + '</td>' +
                '<td>' + escapeHtml(item.sysDomain) + '</td>' +
                '<td>' + clip(item.sysDescription) + '</td>' +
                '<td>' + escapeHtml(item.sysStatus) + '</td>' +
                '<td>' + escapeHtml(item.icon) + '</td>' +
                '<td>' + clip(item.internetUrl) + '</td>' +
                '<td>' + clip(item.internalUrl) + '</td>' +
                '<td>' + escapeHtml(item.sort) + '</td>' +
                '<td><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" role="switch" data-isys-toggle="' + escapeHtml(item.id) + '"' + (item.disabled ? '' : ' checked') + '></label></td>' +
                '<td><div class="isys-actions">' +
                '<button class="btn btn-sm" type="button" data-isys-action="assign" data-isys-id="' + escapeHtml(item.id) + '" data-isys-name="' + escapeHtml(item.sysName) + '">分配用户</button>' +
                '<button class="btn btn-sm" type="button" data-isys-action="edit" data-isys-id="' + escapeHtml(item.id) + '">编辑</button>' +
                '<button class="btn btn-sm btn-danger" type="button" data-isys-action="delete" data-isys-id="' + escapeHtml(item.id) + '">删除</button>' +
                '</div></td></tr>';
        }).join('');
    }

    function findItem(id) { id = Number(id); return internalSystems.find(function (x) { return Number(x.id) === id; }); }

    function openAdd() {
        $('#internalSystemModalTitle').textContent = '新增系统';
        document.getElementById('internalSystemForm').reset();
        setVal('internalSystemId', ''); setVal('internalSystemSort', '0'); setVal('internalSystemDisabled', '0');
        internalSystemModal.show();
    }

    function openEdit(id) {
        var item = findItem(id); if (!item) { return; }
        $('#internalSystemModalTitle').textContent = '编辑系统';
        setVal('internalSystemId', item.id); setVal('internalSystemSysName', item.sysName || ''); setVal('internalSystemSysDomain', item.sysDomain || '');
        setVal('internalSystemSysDescription', item.sysDescription || ''); setVal('internalSystemSysStatus', item.sysStatus || ''); setVal('internalSystemIcon', item.icon || '');
        setVal('internalSystemInternetUrl', item.internetUrl || ''); setVal('internalSystemOpenInternetUrl', item.openInternetUrl || ''); setVal('internalSystemInternalUrl', item.internalUrl || '');
        setVal('internalSystemConfig', item.config || ''); setVal('internalSystemSort', item.sort == null ? 0 : item.sort); setVal('internalSystemRemark', item.remark || '');
        setVal('internalSystemDisabled', item.disabled ? '1' : '0');
        internalSystemModal.show();
    }

    function save(event) {
        event.preventDefault();
        var id = val('internalSystemId');
        var payload = {
            id: id ? Number(id) : null, sysName: val('internalSystemSysName').trim(), sysDomain: val('internalSystemSysDomain').trim(),
            sysDescription: val('internalSystemSysDescription').trim(), sysStatus: val('internalSystemSysStatus').trim(), icon: val('internalSystemIcon').trim(),
            internetUrl: val('internalSystemInternetUrl').trim(), openInternetUrl: val('internalSystemOpenInternetUrl').trim(), internalUrl: val('internalSystemInternalUrl').trim(),
            config: val('internalSystemConfig').trim(), sort: Number(val('internalSystemSort') || 0), remark: val('internalSystemRemark').trim(),
            disabled: val('internalSystemDisabled') === '1', deleted: false
        };
        request('/backend/data/internal-system', {method: id ? 'PUT' : 'POST', body: payload}, function () {
            internalSystemModal.hide(); showToastSimple('内部系统已保存', MsgTypes.SUCCESS, Position.TopCenter); loadInternalSystems();
        });
    }

    function del(id) {
        showConfirm('删除内部系统', '确定删除该内部系统配置？', MsgTypes.WARNING, function () {
            request('/backend/data/internal-system/' + encodeURIComponent(id), {method: 'DELETE'}, function () {
                showToastSimple('内部系统已删除', MsgTypes.SUCCESS, Position.TopCenter); loadInternalSystems();
            });
        });
    }

    function toggleDisabled(id, enabled) {
        var item = findItem(id); if (!item) { return; }
        request('/backend/data/internal-system', {method: 'PUT', body: Object.assign({}, item, {disabled: !enabled})}, function () {
            item.disabled = !enabled; showToastSimple('状态已更新', MsgTypes.SUCCESS, Position.TopCenter);
        }, loadInternalSystems);
    }

    /* ---- 分配用户 ---- */
    function openAssign(sysId, sysName) {
        assignSysId = sysId;
        assignSelected = {};
        document.getElementById('assignSysName').textContent = sysName || '';
        document.getElementById('assignUserSearch').value = '';
        document.getElementById('assignUserList').innerHTML = '<div style="padding:24px;text-align:center;color:var(--hc-muted);">加载中...</div>';
        assignModal.show();

        // 加载全部用户 + 当前已分配用户
        request('/backend/user/findPage2', {method: 'POST', body: {pageNum: 1, pageSize: 9999}}, function (res) {
            assignAllUsers = (res && res.list) ? res.list : [];
            request('/backend/data/internal-system/' + sysId + '/users', {method: 'GET'}, function (ids) {
                (ids || []).forEach(function (uid) { assignSelected[uid] = true; });
                renderAssignList();
            }, function () { renderAssignList(); });
        }, function () { assignAllUsers = []; renderAssignList(); });
    }

    function renderAssignList() {
        var kw = document.getElementById('assignUserSearch').value.trim().toLowerCase();
        var filtered = assignAllUsers.filter(function (u) {
            if (!kw) { return true; }
            return (u.username && u.username.toLowerCase().indexOf(kw) >= 0) ||
                   (u.nickname && u.nickname.toLowerCase().indexOf(kw) >= 0);
        });
        var container = document.getElementById('assignUserList');
        if (!filtered.length) {
            container.innerHTML = '<div style="padding:24px;text-align:center;color:var(--hc-muted);">无匹配用户</div>';
        } else {
            container.innerHTML = filtered.map(function (u) {
                var checked = assignSelected[u.id] ? ' checked' : '';
                var name = escapeHtml(u.username || '');
                var nick = u.nickname ? ' (' + escapeHtml(u.nickname) + ')' : '';
                return '<label style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--hc-line);cursor:pointer;">' +
                    '<input type="checkbox" class="form-check-input assign-user-cb" data-uid="' + u.id + '"' + checked + '>' +
                    '<span>' + name + nick + '</span>' +
                    '</label>';
            }).join('');
        }
        updateAssignCount();
    }

    function updateAssignCount() {
        var count = Object.keys(assignSelected).filter(function (k) { return assignSelected[k]; }).length;
        document.getElementById('assignUserCount').textContent = '已选 ' + count + ' 人';
    }

    function saveAssign() {
        var userIds = Object.keys(assignSelected).filter(function (k) { return assignSelected[k]; }).map(Number);
        request('/backend/data/internal-system/' + assignSysId + '/users', {method: 'PUT', body: userIds}, function () {
            assignModal.hide();
            showToastSimple('用户分配已更新', MsgTypes.SUCCESS, Position.TopCenter);
        });
    }

    function bind() {
        document.getElementById('addInternalSystemBtn').addEventListener('click', openAdd);
        document.getElementById('internalSystemForm').addEventListener('submit', save);
        var tbody = document.getElementById('internalSystemTableBody');
        tbody.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-isys-action]'); if (!btn) { return; }
            var id = btn.getAttribute('data-isys-id');
            var action = btn.getAttribute('data-isys-action');
            if (action === 'edit') { openEdit(id); } else if (action === 'assign') { openAssign(id, btn.getAttribute('data-isys-name')); } else { del(id); }
        });
        tbody.addEventListener('change', function (e) {
            var sw = e.target.closest('[data-isys-toggle]'); if (!sw) { return; }
            toggleDisabled(sw.getAttribute('data-isys-toggle'), sw.checked);
        });

        /* 分配用户事件 */
        document.getElementById('assignUserSearch').addEventListener('input', renderAssignList);
        document.getElementById('assignUserList').addEventListener('change', function (e) {
            var cb = e.target.closest('.assign-user-cb'); if (!cb) { return; }
            var uid = Number(cb.getAttribute('data-uid'));
            if (cb.checked) { assignSelected[uid] = true; } else { delete assignSelected[uid]; }
            updateAssignCount();
        });
        document.getElementById('assignSaveBtn').addEventListener('click', saveAssign);
    }

    function init() { bind(); loadInternalSystems(); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
</body>
</html>
