<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>内容管理 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260623-content">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260623-content">
    <script src="/js/app-theme.js?v=20260623-content"></script>
    <style>
        .ct-section { margin-bottom:32px; }
        .ct-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
        .ct-head h2 { margin:0; font-size:15px; font-weight:700; }
        .ct-panel { border:1px solid var(--hc-line); border-radius:12px; background:var(--hc-surface); box-shadow:var(--hc-shadow-soft); overflow:auto; }
        table.ct-table { width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
        table.ct-table th, table.ct-table td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--hc-line); vertical-align:middle; }
        table.ct-table th { font-weight:700; color:var(--hc-muted); background:var(--hc-surface-strong); white-space:nowrap; }
        table.ct-table tr:hover td { background:var(--hc-soft-accent); }
        .ct-empty { padding:32px 0; text-align:center; color:var(--hc-muted); }
        .ct-clip { display:inline-block; max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ct-actions { display:flex; gap:8px; justify-content:flex-end; }
        .ct-actions .btn { min-height:30px; padding:0 10px; font-size:12px; }
        .ct-actions .btn-danger { color:var(--hc-danger); border-color:rgba(220,38,38,0.32); }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand"><span class="admin-brand-mark">HC</span><span class="admin-brand-text">Home Center</span></div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单"><span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span></button>
    </aside>
    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span><span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题"><span class="hc-theme-toggle-icon" aria-hidden="true"></span><span data-theme-toggle-text>深色</span></button>
            </div>
        </header>
        <main class="admin-content" role="main">
            <section class="ct-section">
                <div class="ct-head"><h2>名言</h2><button class="btn btn-primary btn-sm" type="button" id="addFamousQuoteBtn">新增名言</button></div>
                <div class="ct-panel"><table class="ct-table"><thead><tr><th>ID</th><th>内容</th><th>权重</th><th>固定展示</th><th>备注</th><th class="text-end">操作</th></tr></thead><tbody id="famousQuoteTableBody"><tr><td colspan="6" class="ct-empty">加载中...</td></tr></tbody></table></div>
            </section>
            <section class="ct-section">
                <div class="ct-head"><h2>提示消息</h2><button class="btn btn-primary btn-sm" type="button" id="addPromptMessageBtn">新增消息</button></div>
                <div class="ct-panel"><table class="ct-table"><thead><tr><th>ID</th><th>内容</th><th>权重</th><th>仅展示</th><th>过期时间</th><th>备注</th><th class="text-end">操作</th></tr></thead><tbody id="promptMessageTableBody"><tr><td colspan="7" class="ct-empty">加载中...</td></tr></tbody></table></div>
            </section>
        </main>
    </div>
</div>

<div class="modal fade" id="famousQuoteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="famousQuoteForm">
            <div class="modal-header"><h6 class="modal-title" id="famousQuoteModalTitle">新增名言</h6><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <div class="modal-body">
                <input type="hidden" id="famousQuoteId">
                <div class="mb-3"><label class="form-label" for="famousQuoteFamous">名言内容</label><textarea class="form-control" id="famousQuoteFamous" rows="3" required></textarea></div>
                <div class="mb-3"><label class="form-label" for="famousQuoteWeight">权重</label><input class="form-control" id="famousQuoteWeight" type="number" value="1"></div>
                <div class="mb-3 form-check"><input class="form-check-input" type="checkbox" id="famousQuoteFixedDisplay"><label class="form-check-label" for="famousQuoteFixedDisplay">固定展示</label></div>
                <div><label class="form-label" for="famousQuoteRemark">备注</label><input class="form-control" id="famousQuoteRemark"></div>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-primary">保存</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button></div>
        </form>
    </div>
</div>

<div class="modal fade" id="promptMessageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="promptMessageForm">
            <div class="modal-header"><h6 class="modal-title" id="promptMessageModalTitle">新增消息</h6><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <div class="modal-body">
                <input type="hidden" id="promptMessageId">
                <div class="mb-3"><label class="form-label" for="promptMessageMessage">消息内容</label><textarea class="form-control" id="promptMessageMessage" rows="3" required></textarea></div>
                <div class="mb-3"><label class="form-label" for="promptMessageWeight">权重</label><input class="form-control" id="promptMessageWeight" type="number" value="1"></div>
                <div class="mb-3 form-check"><input class="form-check-input" type="checkbox" id="promptMessageShowOnly"><label class="form-check-label" for="promptMessageShowOnly">仅展示（不可关闭）</label></div>
                <div class="mb-3"><label class="form-label" for="promptMessageExpirationTime">过期时间</label><input class="form-control" id="promptMessageExpirationTime" type="datetime-local"></div>
                <div><label class="form-label" for="promptMessageRemark">备注</label><input class="form-control" id="promptMessageRemark"></div>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-primary">保存</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button></div>
        </form>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260623-content"></script>
<script>window.HcAdminShell && window.HcAdminShell.init({title: '内容管理', breadcrumb: '系统'});</script>
<script>
(function () {
    var famousQuotes = [], promptMessages = [];
    var famousQuoteModal = new bootstrap.Modal(document.getElementById('famousQuoteModal'));
    var promptMessageModal = new bootstrap.Modal(document.getElementById('promptMessageModal'));

    function $(s) { return document.querySelector(s); }
    function val(id) { return document.getElementById(id).value; }
    function setVal(id, v) { document.getElementById(id).value = v; }
    function escapeHtml(v) { return window.HomeCenter.escapeHtml(v); }
    function clip(v) { return '<span class="ct-clip" title="' + escapeHtml(v) + '">' + escapeHtml(v) + '</span>'; }
    function toDatetimeLocalValue(value) {
        if (!value) { return ''; }
        if (typeof value === 'number' || /^\d+$/.test(String(value))) {
            var d = new Date(Number(value));
            var p = function (n) { return n < 10 ? '0' + n : String(n); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
        }
        return String(value).replace(' ', 'T').substring(0, 16);
    }

    // ===== 名言 =====
    function loadFamousQuotes() {
        getRequest('/backend/data/famous-quotes', function (list) { famousQuotes = list || []; renderFamousQuotes(); }, function () { famousQuotes = []; renderFamousQuotes(); });
    }
    function renderFamousQuotes() {
        var tbody = document.getElementById('famousQuoteTableBody');
        if (!famousQuotes.length) { tbody.innerHTML = '<tr><td colspan="6" class="ct-empty">暂无数据</td></tr>'; return; }
        tbody.innerHTML = famousQuotes.map(function (item) {
            return '<tr><td>' + escapeHtml(item.id) + '</td><td>' + clip(item.famous) + '</td><td>' + escapeHtml(item.weight) + '</td>' +
                '<td><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" data-quote-toggle="' + escapeHtml(item.id) + '"' + (item.fixedDisplay ? ' checked' : '') + '></label></td>' +
                '<td>' + clip(item.remark) + '</td><td><div class="ct-actions">' +
                '<button class="btn btn-sm" type="button" data-quote-action="edit" data-quote-id="' + escapeHtml(item.id) + '">编辑</button>' +
                '<button class="btn btn-sm btn-danger" type="button" data-quote-action="delete" data-quote-id="' + escapeHtml(item.id) + '">删除</button>' +
                '</div></td></tr>';
        }).join('');
    }
    function openAddFamousQuote() {
        $('#famousQuoteModalTitle').textContent = '新增名言';
        document.getElementById('famousQuoteForm').reset();
        setVal('famousQuoteId', ''); setVal('famousQuoteWeight', '1');
        document.getElementById('famousQuoteFixedDisplay').checked = false;
        famousQuoteModal.show();
    }
    function openEditFamousQuote(id) {
        var item = famousQuotes.find(function (x) { return Number(x.id) === Number(id); }); if (!item) { return; }
        $('#famousQuoteModalTitle').textContent = '编辑名言';
        setVal('famousQuoteId', item.id); setVal('famousQuoteFamous', item.famous || ''); setVal('famousQuoteWeight', item.weight == null ? 1 : item.weight);
        document.getElementById('famousQuoteFixedDisplay').checked = Boolean(item.fixedDisplay); setVal('famousQuoteRemark', item.remark || '');
        famousQuoteModal.show();
    }
    function saveFamousQuote(e) {
        e.preventDefault();
        var id = val('famousQuoteId');
        var payload = {id: id ? Number(id) : null, famous: val('famousQuoteFamous').trim(), weight: Number(val('famousQuoteWeight') || 0), fixedDisplay: document.getElementById('famousQuoteFixedDisplay').checked, deleted: false, remark: val('famousQuoteRemark').trim()};
        request('/backend/data/famous-quote', {method: id ? 'PUT' : 'POST', body: payload}, function () { famousQuoteModal.hide(); showToastSimple('名言已保存', MsgTypes.SUCCESS, Position.TopCenter); loadFamousQuotes(); });
    }
    function deleteFamousQuote(id) {
        showConfirm('删除名言', '确定删除该名言？', MsgTypes.WARNING, function () { request('/backend/data/famous-quote/' + encodeURIComponent(id), {method: 'DELETE'}, function () { showToastSimple('名言已删除', MsgTypes.SUCCESS, Position.TopCenter); loadFamousQuotes(); }); });
    }
    function toggleFamousQuoteFixed(id, fixed) {
        var item = famousQuotes.find(function (x) { return Number(x.id) === Number(id); }); if (!item) { return; }
        request('/backend/data/famous-quote', {method: 'PUT', body: Object.assign({}, item, {fixedDisplay: fixed})}, function () { item.fixedDisplay = fixed; showToastSimple('状态已更新', MsgTypes.SUCCESS, Position.TopCenter); }, loadFamousQuotes);
    }

    // ===== 提示消息 =====
    function loadPromptMessages() {
        getRequest('/backend/data/prompt-messages', function (list) { promptMessages = list || []; renderPromptMessages(); }, function () { promptMessages = []; renderPromptMessages(); });
    }
    function renderPromptMessages() {
        var tbody = document.getElementById('promptMessageTableBody');
        if (!promptMessages.length) { tbody.innerHTML = '<tr><td colspan="7" class="ct-empty">暂无数据</td></tr>'; return; }
        tbody.innerHTML = promptMessages.map(function (item) {
            return '<tr><td>' + escapeHtml(item.id) + '</td><td>' + clip(item.message) + '</td><td>' + escapeHtml(item.weight) + '</td>' +
                '<td><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" data-msg-toggle="' + escapeHtml(item.id) + '"' + (item.showOnly ? ' checked' : '') + '></label></td>' +
                '<td>' + escapeHtml(item.expirationTime) + '</td><td>' + clip(item.remark) + '</td><td><div class="ct-actions">' +
                '<button class="btn btn-sm" type="button" data-msg-action="edit" data-msg-id="' + escapeHtml(item.id) + '">编辑</button>' +
                '<button class="btn btn-sm btn-danger" type="button" data-msg-action="delete" data-msg-id="' + escapeHtml(item.id) + '">删除</button>' +
                '</div></td></tr>';
        }).join('');
    }
    function openAddPromptMessage() {
        $('#promptMessageModalTitle').textContent = '新增消息';
        document.getElementById('promptMessageForm').reset();
        setVal('promptMessageId', ''); setVal('promptMessageWeight', '1');
        document.getElementById('promptMessageShowOnly').checked = false; setVal('promptMessageExpirationTime', '');
        promptMessageModal.show();
    }
    function openEditPromptMessage(id) {
        var item = promptMessages.find(function (x) { return Number(x.id) === Number(id); }); if (!item) { return; }
        $('#promptMessageModalTitle').textContent = '编辑消息';
        setVal('promptMessageId', item.id); setVal('promptMessageMessage', item.message || ''); setVal('promptMessageWeight', item.weight == null ? 1 : item.weight);
        document.getElementById('promptMessageShowOnly').checked = Boolean(item.showOnly); setVal('promptMessageExpirationTime', toDatetimeLocalValue(item.expirationTime)); setVal('promptMessageRemark', item.remark || '');
        promptMessageModal.show();
    }
    function savePromptMessage(e) {
        e.preventDefault();
        var id = val('promptMessageId');
        var exp = val('promptMessageExpirationTime');
        var payload = {id: id ? Number(id) : null, message: val('promptMessageMessage').trim(), weight: Number(val('promptMessageWeight') || 0), showOnly: document.getElementById('promptMessageShowOnly').checked, expirationTime: exp ? new Date(exp).getTime() : null, deleted: false, remark: val('promptMessageRemark').trim()};
        request('/backend/data/prompt-message', {method: id ? 'PUT' : 'POST', body: payload}, function () { promptMessageModal.hide(); showToastSimple('提示消息已保存', MsgTypes.SUCCESS, Position.TopCenter); loadPromptMessages(); });
    }
    function deletePromptMessage(id) {
        showConfirm('删除提示消息', '确定删除该提示消息？', MsgTypes.WARNING, function () { request('/backend/data/prompt-message/' + encodeURIComponent(id), {method: 'DELETE'}, function () { showToastSimple('提示消息已删除', MsgTypes.SUCCESS, Position.TopCenter); loadPromptMessages(); }); });
    }
    function togglePromptMessageShowOnly(id, showOnly) {
        var item = promptMessages.find(function (x) { return Number(x.id) === Number(id); }); if (!item) { return; }
        request('/backend/data/prompt-message', {method: 'PUT', body: Object.assign({}, item, {showOnly: showOnly})}, function () { item.showOnly = showOnly; showToastSimple('状态已更新', MsgTypes.SUCCESS, Position.TopCenter); }, loadPromptMessages);
    }

    function bind() {
        document.getElementById('addFamousQuoteBtn').addEventListener('click', openAddFamousQuote);
        document.getElementById('famousQuoteForm').addEventListener('submit', saveFamousQuote);
        document.getElementById('famousQuoteTableBody').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-quote-action]'); if (!btn) { return; }
            var id = btn.getAttribute('data-quote-id');
            if (btn.getAttribute('data-quote-action') === 'edit') { openEditFamousQuote(id); } else { deleteFamousQuote(id); }
        });
        document.getElementById('famousQuoteTableBody').addEventListener('change', function (e) {
            var sw = e.target.closest('[data-quote-toggle]'); if (sw) { toggleFamousQuoteFixed(sw.getAttribute('data-quote-toggle'), sw.checked); }
        });

        document.getElementById('addPromptMessageBtn').addEventListener('click', openAddPromptMessage);
        document.getElementById('promptMessageForm').addEventListener('submit', savePromptMessage);
        document.getElementById('promptMessageTableBody').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-msg-action]'); if (!btn) { return; }
            var id = btn.getAttribute('data-msg-id');
            if (btn.getAttribute('data-msg-action') === 'edit') { openEditPromptMessage(id); } else { deletePromptMessage(id); }
        });
        document.getElementById('promptMessageTableBody').addEventListener('change', function (e) {
            var sw = e.target.closest('[data-msg-toggle]'); if (sw) { togglePromptMessageShowOnly(sw.getAttribute('data-msg-toggle'), sw.checked); }
        });
    }

    function init() { bind(); loadFamousQuotes(); loadPromptMessages(); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
</body>
</html>
