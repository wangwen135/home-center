<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>审计与日志 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260626-logs">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260626-logs">
    <script src="/js/app-theme.js?v=20260626-logs"></script>
    <style>
        .log-section { margin-bottom:28px; }
        .log-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
        .log-head h2 { margin:0; font-size:15px; font-weight:700; }
        .log-filters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .log-filters input, .log-filters select { height:38px; padding:0 10px; border:1px solid var(--hc-line); border-radius:8px; background:var(--hc-surface-strong); color:var(--hc-text); font:inherit; font-size:13px; min-width:120px; box-sizing:border-box; }
        .log-filters .btn { min-height:38px; padding:0 14px; font-size:13px; }
        .log-panel { border:1px solid var(--hc-line); border-radius:12px; background:var(--hc-surface); box-shadow:var(--hc-shadow-soft); overflow:auto; }
        table.log-table { width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
        table.log-table th, table.log-table td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--hc-line); vertical-align:middle; }
        table.log-table th { font-weight:700; color:var(--hc-muted); background:var(--hc-surface-strong); white-space:nowrap; }
        table.log-table tr:hover td { background:var(--hc-soft-accent); }
        .log-empty { padding:32px 0; text-align:center; color:var(--hc-muted); }
        .log-cell-clip { display:inline-block; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .st-ok { color:var(--hc-success); font-weight:700; } .st-bad { color:var(--hc-danger); font-weight:700; }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand"><span class="admin-brand-mark">HC</span><span class="admin-brand-text">Home Center</span></div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单"><span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span></button>
    </aside>
    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span><span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题"><span class="hc-theme-toggle-icon" aria-hidden="true"></span><span data-theme-toggle-text>深色</span></button>
            </div>
        </header>
        <main class="admin-content" role="main">
            <section class="log-section">
                <div class="log-head">
                    <h2>操作日志</h2>
                    <div class="log-filters">
                        <input type="search" data-filter="operation-kw" placeholder="用户/类型/模块/备注">
                        <select data-filter="operation-result"><option value="">全部结果</option><option value="ok">正常</option><option value="bad">异常</option></select>
                        <button class="btn btn-sm" type="button" data-log-refresh="operation">刷新</button>
                    </div>
                </div>
                <div class="log-panel"><table class="log-table"><thead><tr><th>时间</th><th>操作类型</th><th>模块</th><th>用户ID</th><th>状态</th><th>备注</th></tr></thead><tbody id="operationLogTableBody"><tr><td colspan="6" class="log-empty">加载中...</td></tr></tbody></table></div>
            </section>
            <section class="log-section">
                <div class="log-head">
                    <h2>安全日志</h2>
                    <div class="log-filters">
                        <input type="search" data-filter="security-kw" placeholder="用户/IP/类型/URL">
                        <button class="btn btn-sm" type="button" data-log-refresh="security">刷新</button>
                    </div>
                </div>
                <div class="log-panel"><table class="log-table"><thead><tr><th>时间</th><th>用户名</th><th>IP</th><th>操作类型</th><th>结果</th><th>方法</th><th>请求URL</th></tr></thead><tbody id="securityLogTableBody"><tr><td colspan="7" class="log-empty">加载中...</td></tr></tbody></table></div>
            </section>
            <section class="log-section">
                <div class="log-head">
                    <h2>系统日志</h2>
                    <div class="log-filters">
                        <input type="search" data-filter="sys-kw" placeholder="操作者/类型/内容">
                        <button class="btn btn-sm" type="button" data-log-refresh="sys">刷新</button>
                    </div>
                </div>
                <div class="log-panel"><table class="log-table"><thead><tr><th>时间</th><th>操作者</th><th>类型</th><th>内容</th><th>IP</th></tr></thead><tbody id="sysLogTableBody"><tr><td colspan="5" class="log-empty">加载中...</td></tr></tbody></table></div>
            </section>
        </main>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260626-logs"></script>
<script>window.HcAdminShell && window.HcAdminShell.init({title: '审计与日志', breadcrumb: '系统'});</script>
<script>
(function () {
    // 各类日志的原始数据 + 筛选条件
    var store = {operation: [], security: [], sys: []};
    var filter = {operationKw: '', operationResult: '', securityKw: '', sysKw: ''};

    function escapeHtml(v) { return window.HomeCenter.escapeHtml(v); }
    function clip(v) { return '<span class="log-cell-clip" title="' + escapeHtml(v) + '">' + escapeHtml(v) + '</span>'; }
    function has(v, kw) { return String(v == null ? '' : v).toLowerCase().indexOf(kw) !== -1; }

    function renderOperation() {
        var kw = filter.operationKw, res = filter.operationResult;
        var rows = store.operation.filter(function (item) {
            if (res === 'ok' && Number(item.status) === 1) { return false; }
            if (res === 'bad' && Number(item.status) !== 1) { return false; }
            if (!kw) { return true; }
            return has(item.operType, kw) || has(item.module, kw) || has(item.userId, kw) || has(item.remark, kw) || has(item.operTime, kw);
        }).map(function (item) {
            var status = Number(item.status) === 1 ? '<span class="st-bad">异常</span>' : '<span class="st-ok">正常</span>';
            return '<tr><td>' + escapeHtml(item.operTime) + '</td><td>' + escapeHtml(item.operType) + '</td><td>' + escapeHtml(item.module) + '</td><td>' + escapeHtml(item.userId) + '</td><td>' + status + '</td><td>' + clip(item.remark) + '</td></tr>';
        });
        document.getElementById('operationLogTableBody').innerHTML = rows.join('') || '<tr><td colspan="6" class="log-empty">暂无数据</td></tr>';
    }

    function renderSecurity() {
        var kw = filter.securityKw;
        var rows = store.security.filter(function (item) {
            if (!kw) { return true; }
            return has(item.username, kw) || has(item.ipAddress, kw) || has(item.operationType, kw) || has(item.operationResult, kw) || has(item.requestUrl, kw);
        }).map(function (item) {
            return '<tr><td>' + escapeHtml(item.operationTime) + '</td><td>' + escapeHtml(item.username) + '</td><td>' + escapeHtml(item.ipAddress) + '</td><td>' + escapeHtml(item.operationType) + '</td><td>' + escapeHtml(item.operationResult) + '</td><td>' + escapeHtml(item.httpMethod) + '</td><td>' + clip(item.requestUrl) + '</td></tr>';
        });
        document.getElementById('securityLogTableBody').innerHTML = rows.join('') || '<tr><td colspan="7" class="log-empty">暂无数据</td></tr>';
    }

    function renderSys() {
        var kw = filter.sysKw;
        var rows = store.sys.filter(function (item) {
            if (!kw) { return true; }
            return has(item.operatorName || item.operatorId, kw) || has(item.logType, kw) || has(item.content, kw);
        }).map(function (item) {
            return '<tr><td>' + escapeHtml(item.sysTime) + '</td><td>' + escapeHtml(item.operatorName || item.operatorId) + '</td><td>' + escapeHtml(item.logType) + '</td><td>' + clip(item.content) + '</td><td>' + escapeHtml(item.ip) + '</td></tr>';
        });
        document.getElementById('sysLogTableBody').innerHTML = rows.join('') || '<tr><td colspan="5" class="log-empty">暂无数据</td></tr>';
    }

    function loadOperationLogs() {
        getRequest('/backend/data/operation-logs', function (list) { store.operation = list || []; renderOperation(); }, function () { store.operation = []; document.getElementById('operationLogTableBody').innerHTML = '<tr><td colspan="6" class="log-empty">加载失败</td></tr>'; });
    }
    function loadSecurityLogs() {
        getRequest('/backend/data/security-logs', function (list) { store.security = list || []; renderSecurity(); }, function () { store.security = []; document.getElementById('securityLogTableBody').innerHTML = '<tr><td colspan="7" class="log-empty">加载失败</td></tr>'; });
    }
    function loadSysLogs() {
        getRequest('/backend/data/sys-logs', function (list) { store.sys = list || []; renderSys(); }, function () { store.sys = []; document.getElementById('sysLogTableBody').innerHTML = '<tr><td colspan="5" class="log-empty">加载失败</td></tr>'; });
    }

    function bind() {
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-log-refresh]'); if (!btn) { return; }
            var t = btn.getAttribute('data-log-refresh');
            if (t === 'operation') { loadOperationLogs(); } else if (t === 'security') { loadSecurityLogs(); } else if (t === 'sys') { loadSysLogs(); }
        });
        document.addEventListener('input', function (e) {
            var el = e.target.closest('[data-filter]'); if (!el) { return; }
            var key = el.getAttribute('data-filter'), v = (el.value || '').trim().toLowerCase();
            if (key === 'operation-kw') { filter.operationKw = v; renderOperation(); }
            else if (key === 'security-kw') { filter.securityKw = v; renderSecurity(); }
            else if (key === 'sys-kw') { filter.sysKw = v; renderSys(); }
        });
        document.addEventListener('change', function (e) {
            var el = e.target.closest('[data-filter="operation-result"]'); if (!el) { return; }
            filter.operationResult = el.value; renderOperation();
        });
    }

    function init() { bind(); loadOperationLogs(); loadSecurityLogs(); loadSysLogs(); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
</body>
</html>
