<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设备管理 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260623-devices">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260623-devices">
    <script src="/js/app-theme.js?v=20260623-devices"></script>
    <style>
        .devm-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .devm-panel { border:1px solid var(--hc-line); border-radius:12px; background:var(--hc-surface); box-shadow:var(--hc-shadow-soft); overflow:auto; }
        table.devm-table { width:100%; border-collapse:collapse; font-size:13px; min-width:1180px; }
        table.devm-table th, table.devm-table td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--hc-line); vertical-align:middle; }
        table.devm-table th { font-weight:700; color:var(--hc-muted); background:var(--hc-surface-strong); white-space:nowrap; }
        table.devm-table tr:hover td { background:var(--hc-soft-accent); }
        .devm-empty { padding:36px 0; text-align:center; color:var(--hc-muted); }
        .st-on { color:var(--hc-success); font-weight:700; } .st-off { color:var(--hc-muted); font-weight:700; }
        .st-enable { color:var(--hc-success); font-weight:700; } .st-disable { color:var(--hc-danger); font-weight:700; }
        .devm-actions { display:flex; gap:8px; justify-content:flex-end; }
        .devm-actions .btn { min-height:30px; padding:0 10px; font-size:12px; }
        .devm-actions .btn-danger { color:var(--hc-danger); border-color:rgba(220,38,38,0.32); }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand"><span class="admin-brand-mark">HC</span><span class="admin-brand-text">Home Center</span></div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单"><span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span></button>
    </aside>
    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span><span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <a class="admin-dropdown-item" href="/device/pc/power.html" role="menuitem">电源控制</a>
                        <a class="admin-dropdown-item" href="/device/pc/monitor.html" role="menuitem">客户端监控</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题"><span class="hc-theme-toggle-icon" aria-hidden="true"></span><span data-theme-toggle-text>深色</span></button>
            </div>
        </header>
        <main class="admin-content" role="main">
            <div class="devm-toolbar">
                <button id="addDeviceBtn" class="btn btn-primary btn-sm" type="button">添加设备</button>
                <a class="btn btn-sm" href="/device/pc/power.html">电源控制</a>
                <a class="btn btn-sm" href="/device/pc/monitor.html">客户端监控</a>
            </div>
            <div class="devm-panel">
                <table class="devm-table">
                    <thead><tr><th>名称</th><th>在线</th><th>IP</th><th>AgentID</th><th>主机名</th><th>Agent版本</th><th>最后在线</th><th>MAC</th><th>状态</th><th class="text-end">操作</th></tr></thead>
                    <tbody id="deviceTableBody"><tr><td colspan="10" class="devm-empty">加载中...</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="deviceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="deviceForm">
            <div class="modal-header"><h6 class="modal-title" id="deviceModalTitle">添加设备</h6><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <div class="modal-body">
                <input type="hidden" id="deviceId">
                <div class="mb-3"><label class="form-label" for="deviceName">设备名称</label><input class="form-control" id="deviceName" required></div>
                <div class="mb-3"><label class="form-label" for="deviceIp">IP 地址</label><input class="form-control" id="deviceIp"></div>
                <div class="mb-3"><label class="form-label" for="deviceAgentId">Agent ID</label><input class="form-control" id="deviceAgentId"></div>
                <div class="mb-3"><label class="form-label" for="deviceHostname">主机名</label><input class="form-control" id="deviceHostname"></div>
                <div class="mb-3"><label class="form-label" for="deviceMac">MAC 地址</label><input class="form-control" id="deviceMac"></div>
                <div class="mb-3"><label class="form-label" for="deviceStatus">状态</label><select class="form-select" id="deviceStatus"><option value="1">启用</option><option value="0">禁用</option></select></div>
                <div><label class="form-label" for="deviceDesc">描述</label><textarea class="form-control" id="deviceDesc" rows="3"></textarea></div>
            </div>
            <div class="modal-footer"><button type="submit" class="btn btn-primary">保存</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button></div>
        </form>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260623-devices"></script>
<script>window.HcAdminShell && window.HcAdminShell.init({title: '设备管理', breadcrumb: '设备'});</script>
<script>
(function () {
    var devices = [];
    var deviceModal = new bootstrap.Modal(document.getElementById('deviceModal'));

    function $(s) { return document.querySelector(s); }
    function val(id) { return document.getElementById(id).value; }
    function setVal(id, v) { document.getElementById(id).value = v; }
    function escapeHtml(v) { return window.HomeCenter.escapeHtml(v); }

    function loadDevices() {
        getRequest('/backend/device/pc/list', function (list) { devices = list || []; renderDevices(); }, function () { devices = []; renderDevices(); });
    }

    function renderDevices() {
        var tbody = document.getElementById('deviceTableBody');
        if (!devices.length) { tbody.innerHTML = '<tr><td colspan="10" class="devm-empty">暂无数据</td></tr>'; return; }
        tbody.innerHTML = devices.map(function (d) {
            var status = Number(d.status) === 1 ? '<span class="st-enable">启用</span>' : '<span class="st-disable">停用</span>';
            var online = d.online ? '<span class="st-on">在线</span>' : '<span class="st-off">离线</span>';
            return '<tr>' +
                '<td>' + escapeHtml(d.name) + '</td>' +
                '<td>' + online + '</td>' +
                '<td>' + escapeHtml(d.ipAddress) + '</td>' +
                '<td>' + escapeHtml(d.agentId) + '</td>' +
                '<td>' + escapeHtml(d.hostname) + '</td>' +
                '<td>' + escapeHtml(d.agentVersion) + '</td>' +
                '<td>' + escapeHtml(d.lastSeenTime) + '</td>' +
                '<td>' + escapeHtml(d.macAddress) + '</td>' +
                '<td>' + status + '</td>' +
                '<td><div class="devm-actions">' +
                '<button class="btn btn-sm" type="button" data-device-action="edit" data-device-id="' + escapeHtml(d.id) + '">编辑</button>' +
                '<button class="btn btn-sm btn-danger" type="button" data-device-action="delete" data-device-id="' + escapeHtml(d.id) + '">删除</button>' +
                '</div></td></tr>';
        }).join('');
    }

    function openAddDeviceModal() {
        $('#deviceModalTitle').textContent = '添加设备';
        document.getElementById('deviceForm').reset();
        setVal('deviceId', ''); setVal('deviceStatus', '1');
        deviceModal.show();
    }

    function openEditDeviceModal(id) {
        var d = devices.find(function (x) { return Number(x.id) === Number(id); });
        if (!d) { return; }
        $('#deviceModalTitle').textContent = '编辑设备';
        setVal('deviceId', d.id); setVal('deviceName', d.name || ''); setVal('deviceIp', d.ipAddress || '');
        setVal('deviceAgentId', d.agentId || ''); setVal('deviceHostname', d.hostname || ''); setVal('deviceMac', d.macAddress || '');
        setVal('deviceStatus', String(d.status == null ? 1 : d.status)); setVal('deviceDesc', d.description || '');
        deviceModal.show();
    }

    function saveDevice(event) {
        event.preventDefault();
        var id = val('deviceId');
        var payload = {id: id ? Number(id) : null, name: val('deviceName').trim(), ipAddress: val('deviceIp').trim(), agentId: val('deviceAgentId').trim(), hostname: val('deviceHostname').trim(), macAddress: val('deviceMac').trim(), status: Number(val('deviceStatus')), description: val('deviceDesc').trim()};
        request(id ? '/backend/device/pc/update' : '/backend/device/pc/add', {method: id ? 'PUT' : 'POST', body: payload}, function () {
            deviceModal.hide(); showToastSimple('设备已保存', MsgTypes.SUCCESS, Position.TopCenter); loadDevices();
        });
    }

    function deleteDevice(id) {
        showConfirm('删除设备', '确定删除该设备？', MsgTypes.WARNING, function () {
            request('/backend/device/pc/delete?id=' + encodeURIComponent(id), {method: 'DELETE'}, function () {
                showToastSimple('设备已删除', MsgTypes.SUCCESS, Position.TopCenter); loadDevices();
            });
        });
    }

    function bind() {
        document.getElementById('addDeviceBtn').addEventListener('click', openAddDeviceModal);
        document.getElementById('deviceForm').addEventListener('submit', saveDevice);
        document.getElementById('deviceTableBody').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-device-action]'); if (!btn) { return; }
            var id = btn.getAttribute('data-device-id');
            if (btn.getAttribute('data-device-action') === 'edit') { openEditDeviceModal(id); } else { deleteDevice(id); }
        });
    }

    function init() { bind(); loadDevices(); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
</body>
</html>
