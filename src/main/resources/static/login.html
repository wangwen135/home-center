<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260620-login">
    <link rel="stylesheet" href="/css/notion-theme.css?v=20260620-login">
    <script src="/js/app-theme.js?v=20260620-login"></script>
</head>
<body class="hc-app hc-notion-page">
<main class="hc-notion-shell hc-notion-stack">
    <section class="hc-notion-auth-shell">
        <a class="hc-notion-back-link" href="/" title="返回导航页" aria-label="返回导航页">
            <span aria-hidden="true">←</span>
            <span>返回导航页</span>
        </a>
        <div class="hc-notion-actions" style="justify-content:flex-end; margin-bottom:12px;">
            <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                <span data-theme-toggle-text>深色</span>
            </button>
        </div>

        <section class="hc-notion-panel">
            <div class="hc-notion-toolbar">
                <div>
                    <p class="hc-notion-kicker">Sign In</p>
                    <h1 class="hc-notion-title">登录 Home Center</h1>
                    <p class="hc-notion-subtitle">使用现有账号进入管理入口、设备控制和后台配置页面。</p>
                </div>
            </div>

            <form id="loginForm" class="hc-notion-grid" novalidate>
                <label>
                    <span class="hc-form-label">用户名</span>
                    <input type="text" class="hc-input" id="username" name="username" autocomplete="username" required>
                </label>
                <label>
                    <span class="hc-form-label">密码</span>
                    <input type="password" class="hc-input" id="password" name="password" autocomplete="current-password" required>
                </label>
                <div id="loginFeedback" class="hc-notion-feedback" hidden></div>
                <div class="hc-notion-actions">
                    <button id="loginSubmit" type="submit" class="hc-button hc-button-primary">登录</button>
                </div>
            </form>
        </section>

        <p class="hc-notion-footer">© Home Center | Auth wwh</p>
    </section>
</main>

<script>
    (function () {
        var form = document.getElementById('loginForm');
        var submitButton = document.getElementById('loginSubmit');
        var feedback = document.getElementById('loginFeedback');

        function setBusy(busy) {
            submitButton.disabled = busy;
            submitButton.textContent = busy ? '登录中...' : '登录';
        }

        function showFeedback(message, error) {
            feedback.hidden = !message;
            feedback.textContent = message || '';
            feedback.classList.toggle('error', Boolean(error));
        }

        function resolveRedirectRef() {
            var ref = new URLSearchParams(window.location.search).get('ref');
            if (!ref || ref.charAt(0) !== '/' || ref.indexOf('//') === 0) {
                return '/admin.html';
            }
            if (ref.indexOf('/login.html') === 0) {
                return '/admin.html';
            }
            return ref;
        }

        form.addEventListener('submit', function (event) {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var formData;

            event.preventDefault();
            if (!username || !password) {
                showFeedback('请输入用户名和密码。', true);
                return;
            }

            formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            setBusy(true);
            showFeedback('');
            window.HomeCenter.request('/login', {
                method: 'POST',
                body: formData
            }).then(function (result) {
                if (result.code !== 200) {
                    throw new Error(result.message || '登录失败');
                }
                window.location.href = resolveRedirectRef();
            }).catch(function (error) {
                showFeedback(error.message || '发生错误，请稍后重试。', true);
                window.HomeCenter.toast(error.message || '登录失败', 'error');
            }).finally(function () {
                setBusy(false);
            });
        });
    })();
</script>
</body>
</html>
