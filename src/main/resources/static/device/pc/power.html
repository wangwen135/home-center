<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑远程控制 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260626-pc-power">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260626-pc-power">
    <script src="/js/app-theme.js?v=20260626-pc-power"></script>
    <style>
        /* 设备控制页私有样式。外壳样式来自 admin-shell.css。 */
        .dev-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .dev-toolbar .hc-button {
            min-height: 38px;
        }

        .dev-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .dev-stat-card {
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface);
            box-shadow: var(--hc-shadow-soft);
            padding: 18px 20px;
        }

        .dev-stat-card strong {
            display: block;
            font-size: 28px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--hc-text);
        }

        .dev-stat-card span {
            color: var(--hc-muted);
            font-size: 13px;
        }

        .dev-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
        }

        .dev-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface);
            box-shadow: var(--hc-shadow-soft);
            padding: 18px;
        }

        .dev-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dev-card-head h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .dev-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .dev-badge.success {
            background: rgba(22, 163, 74, 0.14);
            color: var(--hc-success);
        }

        .dev-badge.warning {
            background: rgba(217, 119, 6, 0.14);
            color: var(--hc-warning);
        }

        .dev-meta {
            display: grid;
            gap: 10px;
        }

        .dev-meta-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dev-label {
            color: var(--hc-muted);
            font-size: 12px;
        }

        .dev-value {
            color: var(--hc-text);
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .dev-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 7.3：危险操作（关机/重启）与普通操作（开机）分区视觉区分 */
        .dev-actions .hc-button.is-danger {
            border-color: rgba(220, 38, 38, 0.32);
            color: var(--hc-danger);
        }

        .dev-actions .hc-button.is-danger:hover {
            background: rgba(220, 38, 38, 0.1);
            color: var(--hc-danger);
        }

        .dev-divider {
            flex: 0 0 auto;
            width: 1px;
            height: 24px;
            background: var(--hc-line);
        }

        .dev-status {
            min-height: 20px;
            color: var(--hc-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .dev-status.error {
            color: var(--hc-danger);
        }

        .dev-empty {
            grid-column: 1 / -1;
            padding: 40px 0;
            border: 1px dashed var(--hc-line);
            border-radius: 10px;
            text-align: center;
            color: var(--hc-muted);
            background: var(--hc-surface);
        }

        @media (max-width: 900px) {
            .dev-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">
            <span class="admin-brand-mark">HC</span>
            <span class="admin-brand-text">Home Center</span>
        </div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单">
            <span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span>
        </button>
    </aside>

    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span>
                        <span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                    <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                    <span data-theme-toggle-text>深色</span>
                </button>
            </div>
        </header>

        <main class="admin-content" role="main">
            <div class="dev-toolbar">
                <a class="hc-button" href="/device/pc/monitor.html">客户端管理</a>
                <button id="powerAllOn" class="hc-button hc-button-primary" type="button">全部开机</button>
                <button id="powerAllOff" class="hc-button is-danger" type="button">全部关机</button>
            </div>

            <section class="dev-summary" aria-label="设备概览">
                <article class="dev-stat-card"><strong id="summaryTotal">0</strong><span>设备总数</span></article>
                <article class="dev-stat-card"><strong id="summaryOnline">0</strong><span>启用设备</span></article>
                <article class="dev-stat-card"><strong id="summaryOffline">0</strong><span>停用设备</span></article>
            </section>

            <section id="deviceList" class="dev-layout" aria-live="polite">
                <div class="dev-empty">设备加载中...</div>
            </section>
        </main>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260626-pc-power"></script>
<script>
    window.HcAdminShell && window.HcAdminShell.init({title: '电脑远程控制', breadcrumb: '设备'});
</script>
<script>
    (function () {
        var devices = [];
        var list = document.getElementById('deviceList');
        var allOn = document.getElementById('powerAllOn');
        var allOff = document.getElementById('powerAllOff');

        function escapeHtml(value) {
            return window.HomeCenter.escapeHtml(value);
        }

        function updateSummary() {
            var enabled = devices.filter(function (device) {
                return Number(device.status) === 1;
            }).length;
            var online = devices.filter(function (device) {
                return Boolean(device.online);
            }).length;
            document.getElementById('summaryTotal').textContent = String(devices.length);
            document.getElementById('summaryOnline').textContent = String(online);
            document.getElementById('summaryOffline').textContent = String(Math.max(0, enabled - online));
        }

        function badge(type, text) {
            return '<span class="dev-badge ' + escapeHtml(type) + '">' + escapeHtml(text) + '</span>';
        }

        function render() {
            updateSummary();
            if (!devices.length) {
                list.innerHTML = '<div class="dev-empty">暂无电脑设备</div>';
                return;
            }
            list.innerHTML = devices.map(function (device) {
                var enabled = Number(device.status) === 1;
                var online = Boolean(device.online);
                return '<article class="dev-card" data-device-id="' + escapeHtml(device.id) + '">' +
                    '<div class="dev-card-head">' +
                    '<h2>' + escapeHtml(device.name || '未命名电脑') + '</h2>' +
                    '<div class="dev-badges">' +
                    badge(enabled ? 'success' : 'warning', enabled ? '启用' : '停用') +
                    badge(online ? 'success' : 'warning', online ? '在线' : '离线') +
                    '</div>' +
                    '</div>' +
                    '<div class="dev-meta">' +
                    '<div class="dev-meta-row"><span class="dev-label">描述</span><span class="dev-value">' + escapeHtml(device.description || '暂无描述') + '</span></div>' +
                    '<div class="dev-meta-row"><span class="dev-label">最后连接 IP</span><span class="dev-value">' + escapeHtml(device.ipAddress || '-') + '</span></div>' +
                    '<div class="dev-meta-row"><span class="dev-label">主 MAC / WOL MAC</span><span class="dev-value">' + escapeHtml(device.macAddress || '-') + '</span></div>' +
                    '<div class="dev-meta-row"><span class="dev-label">最后在线</span><span class="dev-value">' + escapeHtml(device.lastSeenTime || '-') + '</span></div>' +
                    '</div>' +
                    '<div class="dev-actions">' +
                    '<button class="hc-button hc-button-primary" type="button" data-action="on">开机</button>' +
                    '<span class="dev-divider" aria-hidden="true"></span>' +
                    '<button class="hc-button is-danger" type="button" data-action="off">关机</button>' +
                    '<button class="hc-button is-danger" type="button" data-action="restart">重启</button>' +
                    '</div>' +
                    '<div class="dev-status" data-status></div>' +
                    '</article>';
            }).join('');
        }

        function setCardLoading(card, loading) {
            Array.prototype.forEach.call(card.querySelectorAll('button[data-action]'), function (button) {
                button.disabled = loading;
            });
        }

        function setStatus(card, text, error) {
            var status = card.querySelector('[data-status]');
            status.textContent = text || '';
            status.classList.toggle('error', Boolean(error));
        }

        function confirmAction(title, message) {
            return window.HomeCenter.confirm(message, {
                title: title,
                okText: '确认',
                cancelText: '取消'
            });
        }

        function sendPowerCommand(action, deviceId) {
            var card = list.querySelector('[data-device-id="' + deviceId + '"]');
            var actionText = action === 'on' ? '开机' : (action === 'restart' ? '重启' : '关机');
            if (!card) {
                return Promise.resolve();
            }
            // 危险操作（关机/重启）与开机均二次确认；结果在卡片内可见，不只依赖 toast
            return confirmAction(actionText + '确认', '确认向该设备发送' + actionText + '指令？').then(function (confirmed) {
                if (!confirmed) {
                    return;
                }
                setCardLoading(card, true);
                setStatus(card, '正在发送' + actionText + '指令...', false);
                return window.HomeCenter.post('/device/pc/power/' + deviceId + '/' + action)
                    .then(function (result) {
                        if (result.status !== 'success') {
                            throw new Error(result.message || '操作失败');
                        }
                        setStatus(card, result.message || '指令已发送', false);
                        window.HomeCenter.toast(result.message || '指令已发送', 'success');
                    })
                    .catch(function (error) {
                        var message = '操作失败: ' + (error.message || '未知错误');
                        setStatus(card, message, true);
                        window.HomeCenter.toast(message, 'error');
                    })
                    .finally(function () {
                        setCardLoading(card, false);
                    });
            });
        }

        function handleGlobalAction(action) {
            var actionText = action === 'on' ? '全部开机' : '全部关机';
            return confirmAction(actionText, '确认向所有设备发送' + actionText + '指令？').then(function (confirmed) {
                if (!confirmed) {
                    return;
                }
                allOn.disabled = true;
                allOff.disabled = true;
                Promise.all(devices.map(function (device) {
                    return window.HomeCenter.post('/device/pc/power/' + device.id + '/' + action)
                        .then(function (result) {
                            if (result.status !== 'success') {
                                throw new Error(result.message || '操作失败');
                            }
                        });
                })).then(function () {
                    window.HomeCenter.toast(actionText + '指令已发送', 'success');
                }).catch(function (error) {
                    window.HomeCenter.toast(error.message || '批量操作失败', 'error');
                }).finally(function () {
                    allOn.disabled = false;
                    allOff.disabled = false;
                });
            });
        }

        list.addEventListener('click', function (event) {
            var button = event.target.closest('button[data-action]');
            var card;
            if (!button) {
                return;
            }
            card = button.closest('[data-device-id]');
            sendPowerCommand(button.getAttribute('data-action'), card.getAttribute('data-device-id'));
        });

        allOn.addEventListener('click', function () {
            handleGlobalAction('on');
        });
        allOff.addEventListener('click', function () {
            handleGlobalAction('off');
        });

        window.HomeCenter.get('/device/pc/devices')
            .then(function (result) {
                devices = result.data || [];
                render();
            })
            .catch(function (error) {
                list.innerHTML = '<div class="dev-empty">设备加载失败</div>';
                window.HomeCenter.toast(error.message || '加载设备列表失败', 'error');
            });
    })();
</script>
</body>
</html>
