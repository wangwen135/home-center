<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑远程控制</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260620-pc-power">
    <link rel="stylesheet" href="/css/notion-theme.css?v=20260620-pc-power">
    <script src="/js/app-theme.js?v=20260620-pc-power"></script>
    <style>
        .power-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .power-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .pc-card {
            display: grid;
            gap: 16px;
        }

        .pc-card h2 {
            margin: 0;
            color: var(--notion-text);
            font-size: 24px;
            line-height: 1.24;
            font-family: "Times New Roman", Georgia, "Noto Serif SC", serif;
        }

        .pc-meta {
            display: grid;
            gap: 10px;
        }

        .pc-status {
            min-height: 24px;
            color: var(--notion-text-soft);
            font-size: 14px;
            line-height: 1.5;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .pc-status.error {
            color: var(--notion-danger);
        }

        @media (max-width: 900px) {
            .power-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="hc-app hc-notion-page">
<main class="hc-notion-shell hc-notion-stack">
    <header class="hc-notion-header">
        <div>
            <p class="hc-notion-kicker">PC Control</p>
            <h1>电脑远程控制</h1>
            <p class="hc-notion-subtitle">集中管理电脑设备的开机和关机指令，补齐批量操作确认、空状态和错误反馈。</p>
        </div>
        <div class="hc-notion-actions">
            <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                <span data-theme-toggle-text>深色</span>
            </button>
            <a class="hc-button" href="/device/pc/monitor.html">客户端管理</a>
            <button id="powerAllOn" class="hc-button hc-button-primary" type="button">全部开机</button>
            <button id="powerAllOff" class="hc-button" type="button">全部关机</button>
        </div>
    </header>

    <section class="power-summary">
        <article class="hc-notion-card">
            <div class="hc-notion-stat">
                <strong id="summaryTotal">0</strong>
                <span>设备总数</span>
            </div>
        </article>
        <article class="hc-notion-card">
            <div class="hc-notion-stat">
                <strong id="summaryOnline">0</strong>
                <span>启用设备</span>
            </div>
        </article>
        <article class="hc-notion-card">
            <div class="hc-notion-stat">
                <strong id="summaryOffline">0</strong>
                <span>停用设备</span>
            </div>
        </article>
    </section>

    <section id="deviceList" class="power-layout" aria-live="polite">
        <div class="hc-notion-empty">设备加载中...</div>
    </section>
</main>

<script>
    (function () {
        var devices = [];
        var list = document.getElementById('deviceList');
        var allOn = document.getElementById('powerAllOn');
        var allOff = document.getElementById('powerAllOff');

        function escapeHtml(value) {
            return window.HomeCenter.escapeHtml(value);
        }

        function updateSummary() {
            var enabled = devices.filter(function (device) {
                return Number(device.status) === 1;
            }).length;
            var online = devices.filter(function (device) {
                return Boolean(device.online);
            }).length;
            document.getElementById('summaryTotal').textContent = String(devices.length);
            document.getElementById('summaryOnline').textContent = String(online);
            document.getElementById('summaryOffline').textContent = String(Math.max(0, enabled - online));
        }

        function badge(type, text) {
            return '<span class="hc-notion-badge ' + escapeHtml(type) + '">' + escapeHtml(text) + '</span>';
        }

        function render() {
            updateSummary();
            if (!devices.length) {
                list.innerHTML = '<div class="hc-notion-empty">暂无电脑设备</div>';
                return;
            }
            list.innerHTML = devices.map(function (device) {
                var enabled = Number(device.status) === 1;
                var online = Boolean(device.online);
                return '<article class="hc-notion-card pc-card" data-device-id="' + escapeHtml(device.id) + '">' +
                    '<div class="hc-notion-toolbar">' +
                    '<h2>' + escapeHtml(device.name || '未命名电脑') + '</h2>' +
                    '<div class="hc-notion-actions">' +
                    badge(enabled ? 'success' : 'warning', enabled ? '启用' : '停用') +
                    badge(online ? 'success' : 'warning', online ? '在线' : '离线') +
                    '</div>' +
                    '</div>' +
                    '<div class="pc-meta">' +
                    '<div><span class="hc-notion-label">描述</span><div class="hc-notion-value">' + escapeHtml(device.description || '暂无描述') + '</div></div>' +
                    '<div><span class="hc-notion-label">最后连接 IP</span><div class="hc-notion-value">' + escapeHtml(device.ipAddress || '-') + '</div></div>' +
                    '<div><span class="hc-notion-label">主 MAC / WOL MAC</span><div class="hc-notion-value">' + escapeHtml(device.macAddress || '-') + '</div></div>' +
                    '<div><span class="hc-notion-label">最后在线</span><div class="hc-notion-value">' + escapeHtml(device.lastSeenTime || '-') + '</div></div>' +
                    '</div>' +
                    '<div class="hc-notion-actions">' +
                    '<button class="hc-button hc-button-primary" type="button" data-action="on">开机</button>' +
                    '<button class="hc-button" type="button" data-action="off">关机</button>' +
                    '<button class="hc-button" type="button" data-action="restart">重启</button>' +
                    '</div>' +
                    '<div class="pc-status" data-status></div>' +
                    '</article>';
            }).join('');
        }

        function setCardLoading(card, loading) {
            Array.prototype.forEach.call(card.querySelectorAll('button[data-action]'), function (button) {
                button.disabled = loading;
            });
        }

        function setStatus(card, text, error) {
            var status = card.querySelector('[data-status]');
            status.textContent = text || '';
            status.classList.toggle('error', Boolean(error));
        }

        function confirmAction(title, message) {
            return window.HomeCenter.confirm(message, {
                title: title,
                okText: '确认',
                cancelText: '取消'
            });
        }

        function sendPowerCommand(action, deviceId) {
            var card = list.querySelector('[data-device-id="' + deviceId + '"]');
            var actionText = action === 'on' ? '开机' : (action === 'restart' ? '重启' : '关机');
            if (!card) {
                return Promise.resolve();
            }
            return confirmAction(actionText + '确认', '确认向该设备发送' + actionText + '指令？').then(function (confirmed) {
                if (!confirmed) {
                    return;
                }
                setCardLoading(card, true);
                setStatus(card, '正在发送' + actionText + '指令...', false);
                return window.HomeCenter.post('/device/pc/power/' + deviceId + '/' + action)
                    .then(function (result) {
                        if (result.status !== 'success') {
                            throw new Error(result.message || '操作失败');
                        }
                        setStatus(card, result.message || '指令已发送', false);
                        window.HomeCenter.toast(result.message || '指令已发送', 'success');
                    })
                    .catch(function (error) {
                        var message = '操作失败: ' + (error.message || '未知错误');
                        setStatus(card, message, true);
                        window.HomeCenter.toast(message, 'error');
                    })
                    .finally(function () {
                        setCardLoading(card, false);
                    });
            });
        }

        function handleGlobalAction(action) {
            var actionText = action === 'on' ? '全部开机' : '全部关机';
            return confirmAction(actionText, '确认向所有设备发送' + actionText + '指令？').then(function (confirmed) {
                if (!confirmed) {
                    return;
                }
                allOn.disabled = true;
                allOff.disabled = true;
                Promise.all(devices.map(function (device) {
                    return window.HomeCenter.post('/device/pc/power/' + device.id + '/' + action)
                        .then(function (result) {
                            if (result.status !== 'success') {
                                throw new Error(result.message || '操作失败');
                            }
                        });
                })).then(function () {
                    window.HomeCenter.toast(actionText + '指令已发送', 'success');
                }).catch(function (error) {
                    window.HomeCenter.toast(error.message || '批量操作失败', 'error');
                }).finally(function () {
                    allOn.disabled = false;
                    allOff.disabled = false;
                });
            });
        }

        list.addEventListener('click', function (event) {
            var button = event.target.closest('button[data-action]');
            var card;
            if (!button) {
                return;
            }
            card = button.closest('[data-device-id]');
            sendPowerCommand(button.getAttribute('data-action'), card.getAttribute('data-device-id'));
        });

        allOn.addEventListener('click', function () {
            handleGlobalAction('on');
        });
        allOff.addEventListener('click', function () {
            handleGlobalAction('off');
        });

        window.HomeCenter.get('/device/pc/devices')
            .then(function (result) {
                devices = result.data || [];
                render();
            })
            .catch(function (error) {
                list.innerHTML = '<div class="hc-notion-feedback error">设备加载失败</div>';
                window.HomeCenter.toast(error.message || '加载设备列表失败', 'error');
            });
    })();
</script>
</body>
</html>
