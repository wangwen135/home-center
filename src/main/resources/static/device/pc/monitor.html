<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户端管理 - Home Center</title>
    <link rel="stylesheet" href="/css/app-theme.css?v=20260626-pc-monitor">
    <link rel="stylesheet" href="/css/admin-shell.css?v=20260626-pc-monitor">
    <script src="/js/app-theme.js?v=20260626-pc-monitor"></script>
    <style>
        /* 客户端管理页私有样式。外壳样式来自 admin-shell.css；颜色变量统一用 app-theme 的 --hc-*。 */
        .mon-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .mon-toolbar .hc-button { min-height: 38px; }

        .mon-summary {
            margin: 0 0 18px;
            color: var(--hc-muted);
            font-size: 13px;
        }

        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .monitor-card {
            position: relative;
            display: grid;
            gap: 14px;
            min-width: 0;
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: var(--hc-surface);
            box-shadow: var(--hc-shadow-soft);
            padding: 16px;
        }

        .mon-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .mon-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mon-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .mon-badge.success { background: rgba(22, 163, 74, 0.14); color: var(--hc-success); }
        .mon-badge.warning { background: rgba(217, 119, 6, 0.14); color: var(--hc-warning); }

        .screen-frame {
            overflow: hidden;
            border: 1px solid var(--hc-line);
            border-radius: 12px;
            background: linear-gradient(180deg, #ece8e4 0%, #dad4ce 100%);
        }

        :root[data-theme="dark"] .screen-frame {
            background: linear-gradient(180deg, #1f1d1a 0%, #171513 100%);
        }

        .screen {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: rgba(0, 0, 0, 0.08);
        }

        .screen img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            cursor: zoom-in;
        }

        .screen-empty,
        .screen-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--hc-muted);
            background: rgba(255, 255, 255, 0.72);
        }

        :root[data-theme="dark"] .screen-empty,
        :root[data-theme="dark"] .screen-loading {
            background: rgba(22, 21, 19, 0.84);
        }

        .pc-icon {
            width: 56px;
            height: 40px;
            border: 3px solid currentColor;
            border-radius: 8px;
            position: relative;
        }

        .pc-icon::before {
            content: "";
            position: absolute;
            left: 20px;
            bottom: -14px;
            width: 10px;
            height: 10px;
            background: currentColor;
        }

        .pc-icon::after {
            content: "";
            position: absolute;
            left: 10px;
            bottom: -18px;
            width: 30px;
            height: 4px;
            border-radius: 999px;
            background: currentColor;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(37, 99, 235, 0.14);
            border-top-color: var(--hc-accent);
            border-radius: 50%;
            animation: mon-spin 0.9s linear infinite;
        }

        @keyframes mon-spin { to { transform: rotate(360deg); } }

        .device-meta { display: grid; gap: 4px; min-width: 0; }

        .device-name {
            margin: 0;
            overflow: hidden;
            color: var(--hc-text);
            font-size: 18px;
            font-weight: 700;
            line-height: 1.28;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .device-ip {
            color: var(--hc-muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .action-menu {
            position: absolute;
            right: 16px;
            top: 60px;
            z-index: 4;
            min-width: 180px;
            padding: 6px;
            border: 1px solid var(--hc-line);
            border-radius: 10px;
            background: var(--hc-surface-strong);
            box-shadow: var(--hc-shadow);
        }

        .menu-item {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--hc-text);
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
        }

        .menu-item:hover {
            background: var(--hc-soft-accent);
            color: var(--hc-accent);
        }

        .mon-empty {
            grid-column: 1 / -1;
            padding: 40px 0;
            border: 1px dashed var(--hc-line);
            border-radius: 10px;
            text-align: center;
            color: var(--hc-muted);
            background: var(--hc-surface);
        }

        .mon-error { color: var(--hc-danger); border-style: solid; }

        /* Web Shell 终端 */
        .terminal-body {
            height: min(70vh, 640px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
            background: #0f1115;
            color: #f8fafc;
            font-family: Consolas, "SFMono-Regular", Menlo, monospace;
        }

        .terminal-output { flex: 1; overflow: auto; padding: 18px; font-size: 13px; line-height: 1.55; }
        .terminal-line { white-space: pre-wrap; word-break: break-word; }
        .terminal-line.command { color: #93c5fd; }
        .terminal-line.stderr { color: #fca5a5; }
        .terminal-line.system { color: #a7f3d0; }
        .terminal-input {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: #14181f;
        }
        .terminal-input input { flex: 1; min-width: 0; border: 0; outline: 0; color: #f8fafc; background: transparent; font: inherit; }

        /* 截图大图查看 */
        .shot-lightbox {
            position: fixed;
            inset: 0;
            z-index: 1080;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(8, 13, 24, 0.7);
        }
        .shot-lightbox.show { display: flex; }
        .shot-lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: var(--hc-shadow);
        }
        .shot-lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
        }

        @media (max-width: 680px) {
            .action-menu { left: 16px; right: 16px; top: auto; bottom: 16px; }
        }
    </style>
</head>
<body class="hc-app hc-admin-body">
<div class="admin-shell" id="adminShell">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">
            <span class="admin-brand-mark">HC</span>
            <span class="admin-brand-text">Home Center</span>
        </div>
        <nav class="admin-menu" id="adminMenu" aria-label="后台菜单"></nav>
        <button class="admin-sidebar-collapse" id="adminCollapseBtn" type="button" aria-label="折叠/展开菜单">
            <span aria-hidden="true">≪</span><span class="admin-collapse-text">折叠</span>
        </button>
    </aside>

    <div class="admin-body">
        <header class="admin-topbar">
            <div class="admin-topbar-title" id="adminTitle"></div>
            <div class="admin-topbar-actions">
                <div class="admin-user">
                    <button class="admin-user-btn" id="adminUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <img class="admin-user-avatar" id="adminUserAvatar" src="favicon.ico" alt="">
                        <span class="admin-user-name" id="adminUserName">用户</span>
                        <span class="admin-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="admin-dropdown" id="adminUserMenu" role="menu" hidden>
                        <a class="admin-dropdown-item" href="/profile.html" role="menuitem">个人信息</a>
                        <button class="admin-dropdown-item is-danger" type="button" id="adminLogoutBtn" role="menuitem">退出登录</button>
                    </div>
                </div>
                <button class="hc-theme-toggle" type="button" aria-label="切换深浅色主题">
                    <span class="hc-theme-toggle-icon" aria-hidden="true"></span>
                    <span data-theme-toggle-text>深色</span>
                </button>
            </div>
        </header>

        <main class="admin-content" role="main">
            <div class="mon-toolbar">
                <button id="refreshScreenshots" class="hc-button" type="button">刷新截图</button>
                <a class="hc-button" href="/device/pc/power.html">电源控制</a>
            </div>
            <p id="deviceSummary" class="mon-summary">设备加载中...</p>

            <section id="deviceGrid" class="monitor-grid" aria-live="polite">
                <div class="mon-empty">设备加载中...</div>
            </section>
        </main>
    </div>
</div>

<div id="terminalModal" class="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="terminalTitle" class="modal-title">Shell</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="terminal-body">
                    <div id="terminalOutput" class="terminal-output"></div>
                    <div class="terminal-input">
                        <span>$</span>
                        <input id="terminalInput" type="text" autocomplete="off" placeholder="输入命令后回车执行">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="shotLightbox" class="shot-lightbox" role="dialog" aria-modal="true" aria-label="查看截图大图">
    <button type="button" class="hc-close-button shot-lightbox-close" aria-label="关闭">×</button>
    <img id="shotLightboxImg" src="" alt="截图大图">
</div>

<script src="/js/main.js"></script>
<script src="/js/admin-shell.js?v=20260626-pc-monitor"></script>
<script>
    window.HcAdminShell && window.HcAdminShell.init({title: '客户端管理', breadcrumb: '设备'});
</script>
<script>
    (function () {
        var devices = [];
        var activeDeviceId = null;
        var terminalDevice = null;
        var terminalLines = [];
        var terminalLoading = false;
        var devicePermissions = {
            webShell: false,
            screenshot: false,
            power: false
        };
        var commandHistory = [];
        var historyIndex = -1;
        var grid = document.getElementById('deviceGrid');
        var summary = document.getElementById('deviceSummary');
        var refreshButton = document.getElementById('refreshScreenshots');
        var terminalModal = new HcModal(document.getElementById('terminalModal'));
        var terminalTitle = document.getElementById('terminalTitle');
        var terminalOutput = document.getElementById('terminalOutput');
        var terminalInput = document.getElementById('terminalInput');
        var shotLightbox = document.getElementById('shotLightbox');
        var shotLightboxImg = document.getElementById('shotLightboxImg');

        function escapeHtml(value) {
            return window.HomeCenter.escapeHtml(value);
        }

        function latestScreenshotUrl(deviceId) {
            return '/device/pc/' + deviceId + '/screenshot/latest?t=' + Date.now();
        }

        function render() {
            summary.textContent = devices.length + ' 台设备 · 截图每 60 秒自动刷新';
            if (!devices.length) {
                grid.innerHTML = '<div class="mon-empty">暂无客户端设备</div>';
                return;
            }
            grid.innerHTML = devices.map(function (device) {
                var enabled = Number(device.status) === 1;
                var online = Boolean(device.online);
                var image = device.screenshotUrl && !device.noScreenshot ?
                    '<img src="' + escapeHtml(device.screenshotUrl) + '" alt="' + escapeHtml((device.name || '') + ' 截图') + '" data-screenshot="' + escapeHtml(device.id) + '">' : '';
                var empty = device.noScreenshot ? '<div class="screen-empty"><span class="pc-icon"></span><span>暂无截图</span></div>' : '';
                var loading = device.loading ? '<div class="screen-loading"><span class="spinner"></span><span>截图加载中</span></div>' : '';
                var menu = '';
                var menuItems = [];
                if (devicePermissions.screenshot) {
                    menuItems.push('<button class="menu-item" type="button" data-action="screenshot">刷新该设备截图</button>');
                }
                if (devicePermissions.webShell) {
                    menuItems.push('<button class="menu-item" type="button" data-action="terminal">打开终端</button>');
                }
                if (devicePermissions.power) {
                    menuItems.push('<a class="menu-item" href="/device/pc/power.html">前往电源控制</a>');
                }
                menu = activeDeviceId === device.id && menuItems.length
                    ? '<div class="action-menu">' + menuItems.join('') + '</div>'
                    : '';

                return '<article class="monitor-card" data-device-id="' + escapeHtml(device.id) + '">' +
                    '<div class="screen-frame"><div class="screen">' + image + empty + loading + '</div></div>' +
                    '<div class="mon-card-head">' +
                    '<div class="device-meta"><h2 class="device-name" title="' + escapeHtml(device.name || '') + '">' + escapeHtml(device.name || '未命名设备') + '</h2>' +
                    '<div class="device-ip">' + escapeHtml(device.ipAddress || '未配置 IP') + '</div></div>' +
                    '<div class="mon-badges">' +
                    '<span class="mon-badge ' + (enabled ? 'success' : 'warning') + '">' + (enabled ? '启用' : '停用') + '</span>' +
                    '<span class="mon-badge ' + (online ? 'success' : 'warning') + '">' + (online ? '在线' : '离线') + '</span>' +
                    '</div>' +
                    '</div>' + menu + '</article>';
            }).join('');

            Array.prototype.forEach.call(grid.querySelectorAll('img[data-screenshot]'), function (img) {
                img.addEventListener('load', function () {
                    updateScreenshotState(img.getAttribute('data-screenshot'), false, false);
                });
                img.addEventListener('error', function () {
                    updateScreenshotState(img.getAttribute('data-screenshot'), false, true);
                });
            });
        }

        function updateScreenshotState(deviceId, loading, noScreenshot) {
            var device = devices.find(function (item) {
                return String(item.id) === String(deviceId);
            });
            if (!device) {
                return;
            }
            device.loading = loading;
            device.noScreenshot = noScreenshot;
            render();
        }

        function refreshAllScreenshots() {
            if (!devices.length) {
                return;
            }
            refreshButton.disabled = true;
            devices.forEach(function (device) {
                device.loading = true;
                device.noScreenshot = false;
                device.screenshotUrl = latestScreenshotUrl(device.id);
            });
            render();
            window.setTimeout(function () {
                refreshButton.disabled = false;
            }, 800);
        }

        function captureScreenshot(device) {
            activeDeviceId = null;
            device.loading = true;
            device.noScreenshot = false;
            render();
            window.HomeCenter.post('/device/pc/' + device.id + '/screenshot')
                .then(function (result) {
                    if (result.status !== 'success') {
                        throw new Error(result.message || '截图失败');
                    }
                    device.screenshotUrl = latestScreenshotUrl(device.id);
                    window.HomeCenter.toast(result.message || '截图已更新', 'success');
                    render();
                })
                .catch(function (error) {
                    device.loading = false;
                    window.HomeCenter.toast(error.message || '截图失败', 'error');
                    render();
                });
        }

        // 7.2：点击截图查看大图
        function openShotLightbox(url, name) {
            if (!url) {
                return;
            }
            shotLightboxImg.src = url;
            shotLightboxImg.alt = (name || '设备') + ' 截图大图';
            shotLightbox.classList.add('show');
        }

        function closeShotLightbox() {
            shotLightbox.classList.remove('show');
            shotLightboxImg.src = '';
        }

        shotLightbox.addEventListener('click', function (event) {
            if (event.target === shotLightbox || event.target.classList.contains('shot-lightbox-close')) {
                closeShotLightbox();
            }
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && shotLightbox.classList.contains('show')) {
                closeShotLightbox();
            }
        });

        function renderTerminal() {
            terminalOutput.innerHTML = terminalLines.map(function (line) {
                return '<div class="terminal-line ' + escapeHtml(line.type || '') + '">' + escapeHtml(line.text) + '</div>';
            }).join('');
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        function openTerminal(device) {
            activeDeviceId = null;
            terminalDevice = device;
            // 7.4：进入后顶部持续显示目标设备
            terminalTitle.textContent = device.name + ' · Shell';
            terminalLines = [{type: 'system', text: '已连接到 ' + device.name + ' (' + (device.ipAddress || '-') + ')'}];
            terminalInput.value = '';
            historyIndex = commandHistory.length;
            render();
            renderTerminal();
            terminalModal.show();
            window.setTimeout(function () {
                terminalInput.focus();
            }, 30);
        }

        // 7.4：进入 Web Shell 前风险确认
        function requestOpenTerminal(device) {
            window.HomeCenter.confirm('即将在 ' + device.name + ' 上进入 Web Shell。进入后执行单条命令不再重复确认，请确认目标设备无误。', {
                title: '进入 Web Shell',
                okText: '进入',
                cancelText: '取消'
            }).then(function (confirmed) {
                if (confirmed) {
                    openTerminal(device);
                }
            });
        }

        function executeTerminalCommand() {
            var command = terminalInput.value.trim();
            if (!command || !terminalDevice || terminalLoading) {
                return;
            }
            terminalLines.push({type: 'command', text: '$ ' + command});
            commandHistory.push(command);
            historyIndex = commandHistory.length;
            terminalInput.value = '';
            terminalLoading = true;
            terminalLines.push({type: 'system', text: '执行中...'});
            renderTerminal();

            window.HomeCenter.post('/device/pc/command/' + terminalDevice.id, {
                command: command,
                timeoutSeconds: 60
            }).then(function (result) {
                if (result.status !== 'success') {
                    throw new Error(result.message || '命令执行失败');
                }
                var data = result.data || {};
                if (data.stdout) {
                    terminalLines.push({type: 'stdout', text: data.stdout});
                }
                if (data.stderr) {
                    terminalLines.push({type: 'stderr', text: data.stderr});
                }
                if (data.error) {
                    terminalLines.push({type: 'stderr', text: data.error});
                }
                if (!data.stdout && !data.stderr && !data.error) {
                    terminalLines.push({type: 'system', text: 'exitCode=' + data.exitCode});
                }
                if (data.timedOut) {
                    terminalLines.push({type: 'stderr', text: '命令执行超时'});
                } else if (data.success === false) {
                    terminalLines.push({type: 'stderr', text: '命令执行失败'});
                } else {
                    terminalLines.push({type: 'system', text: '命令执行成功'});
                }
            }).catch(function (error) {
                terminalLines.push({type: 'stderr', text: error.message || '命令执行失败'});
            }).finally(function () {
                terminalLoading = false;
                renderTerminal();
                terminalInput.focus();
            });
        }

        grid.addEventListener('click', function (event) {
            // 7.2：点击截图图片 → 查看大图（不触发菜单）
            var shotImg = event.target.closest('img[data-screenshot]');
            if (shotImg) {
                var shotDevice = devices.find(function (item) {
                    return String(item.id) === String(shotImg.getAttribute('data-screenshot'));
                });
                if (shotDevice && shotDevice.screenshotUrl) {
                    openShotLightbox(shotDevice.screenshotUrl, shotDevice.name);
                }
                return;
            }
            var card = event.target.closest('[data-device-id]');
            var device;
            var action;
            if (!card) {
                activeDeviceId = null;
                render();
                return;
            }
            device = devices.find(function (item) {
                return String(item.id) === String(card.getAttribute('data-device-id'));
            });
            action = event.target.closest('[data-action]');
            if (action && device) {
                if (action.getAttribute('data-action') === 'screenshot') {
                    captureScreenshot(device);
                }
                if (action.getAttribute('data-action') === 'terminal') {
                    requestOpenTerminal(device);
                }
                return;
            }
            activeDeviceId = activeDeviceId === device.id ? null : device.id;
            render();
        });

        document.addEventListener('click', function (event) {
            if (!event.target.closest('.monitor-card')) {
                activeDeviceId = null;
                render();
            }
        });

        refreshButton.addEventListener('click', refreshAllScreenshots);
        terminalInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                executeTerminalCommand();
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                historyIndex = Math.max(0, historyIndex - 1);
                terminalInput.value = commandHistory[historyIndex] || '';
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                historyIndex = Math.min(commandHistory.length, historyIndex + 1);
                terminalInput.value = commandHistory[historyIndex] || '';
            }
        });

        Promise.all([
            window.HomeCenter.get('/device/pc/permissions'),
            window.HomeCenter.get('/device/pc/devices')
        ]).then(function (results) {
                devicePermissions = results[0].data || devicePermissions;
                devices = (results[1].data || []).map(function (device) {
                    device.loading = true;
                    device.noScreenshot = false;
                    device.screenshotUrl = latestScreenshotUrl(device.id);
                    return device;
                });
                render();
            })
            .catch(function (error) {
                summary.textContent = '设备加载失败';
                grid.innerHTML = '<div class="mon-empty mon-error">设备加载失败</div>';
                window.HomeCenter.toast(error.message || '加载设备列表失败', 'error');
            });

        window.setInterval(refreshAllScreenshots, 60000);
    })();
</script>
</body>
</html>
